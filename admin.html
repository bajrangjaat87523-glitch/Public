<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VT Dairy Farm - Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f5;
  color:#222;
  padding-bottom:30px;
}

header{
  background:#087a45;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  font-size:25px;
}

header p{
  margin-top:6px;
}

.container{
  width:94%;
  max-width:700px;
  margin:18px auto;
}

.notice{
  background:#fff8d9;
  border-left:5px solid #e0ad00;
  padding:14px;
  border-radius:9px;
  margin-bottom:15px;
  line-height:1.6;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

.stat{
  background:white;
  padding:18px 10px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 8px #0001;
}

.stat-number{
  font-size:26px;
  font-weight:bold;
  color:#087a45;
  margin-bottom:5px;
}

.card{
  background:white;
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}

.card h2{
  margin-bottom:12px;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.product-name{
  font-size:20px;
  font-weight:bold;
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

input[type="number"]{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.status{
  padding:9px;
  border-radius:8px;
  margin:10px 0;
  text-align:center;
  font-weight:bold;
}

.active{
  background:#e7f7ed;
  color:#126b35;
}

.inactive{
  background:#ffe5e5;
  color:#a33;
}

button{
  width:100%;
  border:0;
  color:white;
  padding:12px;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

.green{
  background:#087a45;
}

.red{
  background:#d9534f;
}

.blue{
  background:#2878c8;
}

.orange{
  background:#e09b00;
}

.gray{
  background:#555;
}

.message{
  display:none;
  padding:13px;
  border-radius:9px;
  background:#e7f7ed;
  color:#126b35;
  margin-bottom:15px;
  font-weight:bold;
  text-align:center;
}

.order{
  border:1px solid #e1e1e1;
  border-radius:10px;
  padding:13px;
  margin-top:10px;
}

.order h3{
  margin-bottom:8px;
}

.order-id{
  background:#f4f7f5;
  padding:9px;
  border-radius:8px;
  margin-bottom:10px;
  font-weight:bold;
  word-break:break-all;
}

.info{
  color:#555;
  line-height:1.7;
  font-size:14px;
}

.items{
  border-top:1px solid #eee;
  margin-top:10px;
  padding-top:8px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.total{
  text-align:right;
  color:#087a45;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.order-status{
  display:block;
  padding:9px;
  border-radius:7px;
  background:#fff3cd;
  color:#856404;
  margin-top:10px;
  font-weight:bold;
  text-align:center;
}

.status-controls{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.status-title{
  font-weight:bold;
  margin-bottom:6px;
}

.empty{
  text-align:center;
  color:#777;
  padding:18px 10px;
}

</style>
</head>

<body>

<header>

<h1>🧑‍💼 VT Dairy Farm</h1>

<p>Admin Panel</p>

</header>


<div class="container">


<div class="notice">

<b>⚙️ Admin Dashboard</b><br>

यहाँ से Products, Rates और Customer Orders संभाल सकते हैं।

</div>


<div id="message" class="message"></div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div id="orderCount" class="stat-number">
0
</div>

Orders

</div>


<div class="stat">

<div id="productCount" class="stat-number">
0
</div>

Products

</div>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>🥛 Products & Rates</h2>

<div id="products"></div>

</div>


<!-- CUSTOMER ORDERS -->

<div class="card">

<h2>📦 Customer Orders</h2>

<button
class="blue"
onclick="showOrders()">

🔄 Orders Refresh करें

</button>

<div id="orders"></div>

</div>


</div>


<script>


/* PRODUCTS */

const defaultProducts = [

{
id:"milk",
name:"दूध",
price:80,
unit:"लीटर",
active:true
},

{
id:"ghee",
name:"घी",
price:0,
unit:"किलो",
active:false
},

{
id:"paneer",
name:"पनीर",
price:0,
unit:"किलो",
active:false
},

{
id:"mawa",
name:"मावा",
price:0,
unit:"किलो",
active:false
}

];


/* GET PRODUCTS */

function getProducts(){

try{

const saved =
JSON.parse(
localStorage.getItem("vtDairyProducts")
);

if(
Array.isArray(saved) &&
saved.length > 0
){

return saved;

}

}catch(error){}

localStorage.setItem(
"vtDairyProducts",
JSON.stringify(defaultProducts)
);

return defaultProducts;

}


/* RENDER PRODUCTS */

function renderProducts(){

const box =
document.getElementById("products");

const products =
getProducts();

box.innerHTML = "";


products.forEach(function(product){

const statusText =
product.active
? "🟢 Product चालू है"
: "🔴 Product बंद है";

const statusClass =
product.active
? "active"
: "inactive";

const buttonText =
product.active
? "🔴 Product बंद करें"
: "🟢 Product चालू करें";

const buttonClass =
product.active
? "red"
: "green";


box.innerHTML += `

<div class="product">

<div class="product-name">

${escapeHTML(product.name)}

</div>


<div class="status ${statusClass}">

${statusText}

</div>


<label>

Rate (₹ / ${escapeHTML(product.unit)})

</label>


<input
type="number"
min="0"
step="1"
id="price_${escapeHTML(product.id)}"
value="${Number(product.price) || 0}"
>


<button
class="${buttonClass}"
onclick="toggleProduct('${escapeJS(product.id)}')">

${buttonText}

</button>


<button
class="blue"
onclick="saveProduct('${escapeJS(product.id)}')">

💾 Rate Save करें

</button>

</div>

`;

});


updateProductCount();

}


/* SAVE PRODUCT RATE */

function saveProduct(id){

const products =
getProducts();

const index =
products.findIndex(function(product){

return product.id === id;

});


if(index === -1){

alert("Product नहीं मिला।");

return;

}


const input =
document.getElementById(
"price_" + id
);


const price =
Number(input.value);


if(
isNaN(price) ||
price < 0
){

alert("सही Rate डालें।");

return;

}


products[index].price =
price;


localStorage.setItem(
"vtDairyProducts",
JSON.stringify(products)
);


showMessage(
"✅ " +
products[index].name +
" का Rate Save हो गया।"
);


renderProducts();

}


/* PRODUCT ON / OFF */

function toggleProduct(id){

const products =
getProducts();

const index =
products.findIndex(function(product){

return product.id === id;

});


if(index === -1){

alert("Product नहीं मिला।");

return;

}


products[index].active =
!products[index].active;


localStorage.setItem(
"vtDairyProducts",
JSON.stringify(products)
);


showMessage(

products[index].name +

(
products[index].active
? " 🟢 चालू कर दिया गया।"
: " 🔴 बंद कर दिया गया।"
)

);


renderProducts();

}


/* PRODUCT COUNT */

function updateProductCount(){

const products =
getProducts();

const activeProducts =
products.filter(function(product){

return (
product.active &&
Number(product.price) > 0
);

});


document.getElementById(
"productCount"
).textContent =
activeProducts.length;

}


/* MESSAGE */

function showMessage(text){

const box =
document.getElementById("message");

box.textContent =
text;

box.style.display =
"block";


setTimeout(function(){

box.style.display =
"none";

},2500);

}


/* GET ORDERS */

function getOrders(){

try{

const saved =
JSON.parse(
localStorage.getItem("vtDairyOrders")
);

if(Array.isArray(saved)){

return saved;

}

}catch(error){}

return [];

}


/* SHOW ORDERS */

function showOrders(){

const orders =
getOrders();


document.getElementById(
"orderCount"
).textContent =
orders.length;


const box =
document.getElementById("orders");

box.innerHTML = "";


if(orders.length === 0){

box.innerHTML = `

<div class="empty">

📦 अभी कोई Customer Order नहीं है।

</div>

`;

return;

}


orders
.slice()
.reverse()
.forEach(function(order){

let itemsHTML = "";


if(
Array.isArray(order.items) &&
order.items.length > 0
){

order.items.forEach(function(item){

itemsHTML += `

<div class="item">

<span>

${escapeHTML(
item.name || "Product"
)}

× ${Number(item.quantity) || 1}

${escapeHTML(
item.unit || ""
)}

</span>


<span>

₹${Number(item.price) || 0}

</span>

</div>

`;

});

}else{

itemsHTML = `

<div class="empty">

Order में कोई Product नहीं मिला।

</div>

`;

}


const total =
Number(order.total) ||
Number(order.order_total) ||
0;


const status =
order.status ||
"Pending";


box.innerHTML += `

<div class="order">


<div class="order-id">

Order ID:
${escapeHTML(order.id || "नहीं है")}

</div>


<h3>

👤

${escapeHTML(
order.customerName ||
order.name ||
"Customer"
)}

</h3>


<div class="info">

📞

${escapeHTML(
order.phone ||
"नहीं है"
)}

<br>

📍

${escapeHTML(
order.address ||
"नहीं है"
)}

<br>

📅

${escapeHTML(
order.date ||
"नहीं है"
)}

<br>

🕐

${escapeHTML(
order.time ||
"नहीं है"
)}

</div>


<div class="items">

${itemsHTML}

</div>


<div class="total">

कुल: ₹${total}

</div>


<div class="order-status">

वर्तमान Status:
${escapeHTML(status)}

</div>


<div class="status-controls">

<div class="status-title">

📦 Order Status बदलें

</div>


<button
class="orange"
onclick="updateOrderStatus(
'${escapeJS(order.id || "")}',
'Pending'
)">

🕐 Pending

</button>


<button
class="blue"
onclick="updateOrderStatus(
'${escapeJS(order.id || "")}',
'Confirmed'
)">

✅ Confirmed

</button>


<button
class="green"
onclick="updateOrderStatus(
'${escapeJS(order.id || "")}',
'Delivered'
)">

🚚 Delivered

</button>


<button
class="red"
onclick="updateOrderStatus(
'${escapeJS(order.id || "")}',
'Cancelled'
)">

❌ Cancelled

</button>


</div>


</div>

`;

});

}


/* UPDATE ORDER STATUS */

function updateOrderStatus(
orderId,
newStatus
){

const orders =
getOrders();


const index =
orders.findIndex(function(order){

return String(order.id) ===
String(orderId);

});


if(index === -1){

alert("Order नहीं मिला।");

return;

}


orders[index].status =
newStatus;


localStorage.setItem(
"vtDairyOrders",
JSON.stringify(orders)
);


showMessage(
"✅ Order Status बदलकर " +
newStatus +
" कर दिया गया।"
);


showOrders();

}


/* ESCAPE HTML */

function escapeHTML(value){

const div =
document.createElement("div");

div.textContent =
String(value);

return div.innerHTML;

}


/* ESCAPE JAVASCRIPT */

function escapeJS(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* START */

renderProducts();

showOrders();

</script>

</body>

</html>
