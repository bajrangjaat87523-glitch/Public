<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087a45"><title>VT Dairy Farm - Admin</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f4f7f5;color:#222;padding:14px}header{background:#087a45;color:white;padding:18px;border-radius:12px;margin-bottom:14px}h1{font-size:24px}.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #0001}h2{font-size:20px;margin-bottom:10px}input,select,button{width:100%;padding:11px;margin-top:8px;border-radius:7px;font-size:15px}input,select{border:1px solid #bbb;background:white}button{border:0;background:#087a45;color:white;font-weight:bold}.secondary{background:#455a64}.danger{background:#b3261e}.hidden{display:none!important}.error{color:#b3261e;white-space:pre-wrap}.good{color:#087a45}.muted{color:#666;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.stat{background:#edf7ef;padding:12px;border-radius:9px;text-align:center}.stat strong{display:block;font-size:22px;color:#087a45}.order{border:1px solid #e1e1e1;border-radius:9px;padding:12px;margin-top:10px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
</style></head><body><header><h1>🥛 VT Dairy Farm</h1><p>Admin Panel</p></header>
<section id="loginPage" class="card"><h2>Admin Login</h2><form id="loginForm"><input id="adminEmail" type="email" placeholder="Admin Email" required><input id="adminPassword" type="password" placeholder="Password" required><button>Login करें</button></form><p id="loginError" class="error"></p></section>
<main id="adminPanel" class="hidden"><div class="card"><div class="row"><div><h2>डैशबोर्ड</h2><p id="adminSignedIn" class="muted"></p></div><button id="logoutBtn" class="secondary">Logout</button></div></div>
<div class="card"><h2>Sales & Business Report</h2><div class="grid"><div class="stat"><strong id="totalOrders">0</strong>कुल ऑर्डर</div><div class="stat"><strong id="pendingOrders">0</strong>Pending</div><div class="stat"><strong id="cancelledOrders">0</strong>Cancel</div><div class="stat"><strong id="deliveredOrders">0</strong>Delivered</div><div class="stat"><strong id="deliveredRevenue">₹0</strong>Delivered बिक्री</div></div><button id="refreshAll">सब Refresh करें</button></div>
<div class="card"><h2>डिलीवरी बॉय अकाउंट्स</h2><p class="muted">मंजूरी के बाद ही डिलीवरी बॉय ऑर्डर देख पाएगा।</p><p id="usersMessage" class="error"></p><div id="deliveryUsers"></div></div>
<div class="card"><h2>Products & Rates</h2><form id="productForm"><input id="productId" type="hidden"><input id="productName" placeholder="Product name" required><div class="row"><input id="productPrice" type="number" min="0" step="0.5" placeholder="Rate" required><select id="productUnit"><option>लीटर</option><option>किलो</option></select></div><label><input id="productActive" type="checkbox" checked style="width:auto"> Active</label><button>Product Save करें</button><button type="button" id="clearProduct" class="secondary">नया Product</button></form><p id="productMessage" class="error"></p><div id="productsList"></div></div>
<div class="card"><h2>Customer Orders</h2><p id="ordersMessage" class="error"></p><div id="ordersList"></div></div>
<div class="card"><h2>Delivery Notifications</h2><p id="notificationsMessage" class="error"></p><div id="notificationsList"></div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyD9cwaW54d5VRfK6rbuqSExcz27bFHdSm8",authDomain:"vt-dairy-farm-9afc8.firebaseapp.com",projectId:"vt-dairy-farm-9afc8",storageBucket:"vt-dairy-farm-9afc8.firebasestorage.app",messagingSenderId:"86012601125",appId:"1:86012601125:web:6a6d81f5d93aae16a030cc"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);const ADMIN="vtdairyfarm2025@gmail.com";let orders=[],users=[],products=[];
const defaults=[{id:"milk",name:"दूध",price:80,unit:"लीटर",active:true},{id:"ghee",name:"घी",price:0,unit:"किलो",active:false},{id:"paneer",name:"पनीर",price:0,unit:"किलो",active:false},{id:"mawa",name:"मावा",price:0,unit:"किलो",active:false}];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function dt(v){try{return v&&v.toDate?v.toDate().toLocaleString("hi-IN"):v?new Date(v).toLocaleString("hi-IN"):"—"}catch(e){return "—"}}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($("adminEmail").value.trim(),$("adminPassword").value);if((auth.currentUser.email||"").toLowerCase()!==ADMIN){await auth.signOut();throw Error("यह Admin ईमेल नहीं है।");}}catch(e){$("loginError").textContent="लॉगिन नहीं हुआ: "+e.message;}};
auth.onAuthStateChanged(u=>{if(u&&(u.email||"").toLowerCase()===ADMIN){$("loginPage").classList.add("hidden");$("adminPanel").classList.remove("hidden");$("adminSignedIn").textContent="लॉगिन: "+u.email;refreshAll();}else{$("loginPage").classList.remove("hidden");$("adminPanel").classList.add("hidden");if(u)auth.signOut();}});
$("logoutBtn").onclick=()=>auth.signOut();$("refreshAll").onclick=refreshAll;
async function refreshAll(){await Promise.allSettled([loadOrders(),loadUsers(),loadProducts(),loadNotes()]);}
async function loadUsers(){try{let s=await db.collection("deliveryUsers").get();users=s.docs.map(d=>({uid:d.id,...d.data()}));renderUsers();renderOrders();$("usersMessage").textContent="";}catch(e){$("usersMessage").textContent="अकाउंट नहीं लोड हुए: "+e.message;}}
function renderUsers(){$("deliveryUsers").innerHTML=users.length?users.map(u=>`<div class="order"><b>${esc(u.displayName||u.username)}</b> (@${esc(u.username)})<p class="muted">${esc(u.email)} · रजिस्ट्रेशन: ${esc(dt(u.createdAt))}</p><p>स्थिति: <b>${esc(u.status||"pending")}</b></p>${u.status==="approved"?`<button class="secondary" onclick="setUser('${esc(u.uid)}','pending')">Approval रोकें</button>`:`<button onclick="setUser('${esc(u.uid)}','approved')">Approve करें</button>`}<button class="danger" onclick="setUser('${esc(u.uid)}','rejected')">Reject करें</button></div>`).join(""):'<p class="muted">अभी कोई रजिस्ट्रेशन नहीं है।</p>';}
window.setUser=async(uid,status)=>{try{await db.collection("deliveryUsers").doc(uid).update({status,approvedAt:status==="approved"?firebase.firestore.FieldValue.serverTimestamp():null,approvedByEmail:auth.currentUser.email});await loadUsers();}catch(e){$("usersMessage").textContent="अपडेट नहीं हुआ: "+e.message;}};
async function loadOrders(){try{let s=await db.collection("orders").get();orders=s.docs.map(d=>({docId:d.id,...d.data()}));orders.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));renderReport();renderOrders();}catch(e){$("ordersMessage").textContent="ऑर्डर नहीं लोड हुए: "+e.message;}}
function renderReport(){let d=orders.filter(o=>String(o.status).toLowerCase()==="delivered");$("totalOrders").textContent=orders.length;$("pendingOrders").textContent=orders.filter(o=>["pending","confirmed"].includes(String(o.status).toLowerCase())).length;$("cancelledOrders").textContent=orders.filter(o=>String(o.status).toLowerCase()==="cancelled").length;$("deliveredOrders").textContent=d.length;$("deliveredRevenue").textContent="₹"+d.reduce((s,o)=>s+(Number(o.total)||0),0).toLocaleString("en-IN");}
function opts(selected){return '<option value="">— Delivery Boy चुनें —</option>'+users.filter(u=>u.status==="approved").map(u=>`<option value="${esc(u.email)}" ${u.email===selected?"selected":""}>${esc(u.displayName||u.username)} (@${esc(u.username)})</option>`).join("");}
function renderOrders(){$("ordersList").innerHTML=orders.length?orders.map(o=>{let s=String(o.status||"Pending"),c=s.toLowerCase()==="cancelled",it=Array.isArray(o.items)?o.items.map(i=>esc(i.name||i.productName||"सामान")+" × "+esc(i.quantity??i.qty??1)).join("<br>"):esc(o.items||"—"),has=o.latitude!=null&&o.longitude!=null&&o.latitude!==""&&o.longitude!=="",map=has?"https://www.google.com/maps?q="+encodeURIComponent(o.latitude+","+o.longitude):"";return `<div class="order"><h3>ऑर्डर ${esc(o.id||o.docId)}</h3><p>ग्राहक: ${esc(o.customerName||o.name||"—")} · फोन: ${esc(o.phone||"—")}</p><p>पता: ${esc(o.address||"—")}</p><p>सामान: ${it}</p><p>रकम: ₹${esc(o.total??0)} · भुगतान: ${esc(o.paymentMethod||"Cash")}</p><p>समय: ${esc(dt(o.createdAt))}</p><p>स्थिति: <b class="${c?"error":"good"}">${c?"Cancel":esc(s)}</b></p>${map?`<p><a href="${map}" target="_blank" rel="noopener">📍 लोकेशन</a></p>`:""}<label>Delivery Boy</label><select id="as-${esc(o.docId)}">${opts(o.assignedToEmail||"")}</select><button onclick="assign('${esc(o.docId)}')">Assign करें</button>${o.assignedToEmail?`<button class="secondary" onclick="unassign('${esc(o.docId)}')">Assignment हटाएँ</button>`:""}<label>Status</label><select id="st-${esc(o.docId)}"><option ${s==="Pending"?"selected":""}>Pending</option><option ${s==="Confirmed"?"selected":""}>Confirmed</option><option ${s==="Delivered"?"selected":""}>Delivered</option><option value="Cancelled" ${c?"selected":""}>Cancel</option></select><button class="secondary" onclick="saveStatus('${esc(o.docId)}')">Status Save करें</button></div>`;}).join(""):'<p class="muted">अभी कोई ऑर्डर नहीं है।</p>';}
window.assign=async id=>{let email=$("as-"+id).value;if(!email){$("ordersMessage").textContent="मंजूर Delivery Boy चुनें।";return;}try{await db.collection("orders").doc(id).update({assignedToEmail:email,assignedAt:firebase.firestore.FieldValue.serverTimestamp(),assignedBy:auth.currentUser.email});await loadOrders();}catch(e){$("ordersMessage").textContent="Assign नहीं हुआ: "+e.message;}};
window.unassign=async id=>{try{await db.collection("orders").doc(id).update({assignedToEmail:firebase.firestore.FieldValue.delete(),assignedAt:firebase.firestore.FieldValue.delete(),assignedBy:firebase.firestore.FieldValue.delete()});await loadOrders();}catch(e){$("ordersMessage").textContent=e.message;}};
window.saveStatus=async id=>{try{await db.collection("orders").doc(id).update({status:$("st-"+id).value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await loadOrders();}catch(e){$("ordersMessage").textContent="Status अपडेट नहीं हुआ: "+e.message;}};
async function loadProducts(){try{let s=await db.collection("products").get();products=s.docs.map(d=>({id:d.id,...d.data()}));if(!products.length){for(let p of defaults)await db.collection("products").doc(p.id).set(p);products=defaults;}renderProducts();}catch(e){$("productMessage").textContent=e.message;}}
function renderProducts(){$("productsList").innerHTML=products.map(p=>`<div class="order"><b>${esc(p.name)}</b> — ₹${esc(p.price??0)}/${esc(p.unit||"किलो")} · ${p.active?"Active":"Inactive"}<button class="secondary" onclick="editProduct('${esc(p.id)}')">Edit</button><button onclick="toggleProduct('${esc(p.id)}')">${p.active?"Inactive करें":"Active करें"}</button></div>`).join("");}
window.editProduct=id=>{let p=products.find(x=>x.id===id);if(!p)return;$("productId").value=id;$("productName").value=p.name;$("productPrice").value=p.price??0;$("productUnit").value=p.unit||"किलो";$("productActive").checked=!!p.active;};
$("clearProduct").onclick=()=>{$("productForm").reset();$("productId").value="";$("productActive").checked=true;};
$("productForm").onsubmit=async e=>{e.preventDefault();try{let id=$("productId").value||$("productName").value.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now().toString().slice(-4);await db.collection("products").doc(id).set({name:$("productName").value.trim(),price:Number($("productPrice").value),unit:$("productUnit").value,active:$("productActive").checked,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});$("productMessage").textContent="Product सेव हो गया।";$("clearProduct").click();await loadProducts();}catch(e){$("productMessage").textContent=e.message;}};
window.toggleProduct=async id=>{let p=products.find(x=>x.id===id);try{await db.collection("products").doc(id).update({active:!p.active});await loadProducts();}catch(e){$("productMessage").textContent=e.message;}};
async function loadNotes(){try{let s=await db.collection("notificationRequests").where("type","==","delivery_completed").get(),a=s.docs.map(d=>({id:d.id,...d.data()}));a.sort((x,y)=>(y.createdAt?.toMillis?.()||0)-(x.createdAt?.toMillis?.()||0));$("notificationsList").innerHTML=a.length?a.map(n=>`<div class="order"><b>डिलीवरी पूरी</b><p>ऑर्डर: ${esc(n.orderId||"—")}</p><p>ग्राहक: ${esc(n.customerName||"—")} ${esc(n.customerPhone||"")}</p><p>डिलीवरी बॉय: ${esc(n.deliveryBoyUsername||n.deliveryBoyEmail||"—")}</p><p>${esc(dt(n.createdAt))}</p><p>स्थिति: ${esc(n.status||"pending")}</p></div>`).join(""):'<p class="muted">अभी कोई notification नहीं है।</p>';}catch(e){$("notificationsMessage").textContent="Notifications नहीं लोड हुए: "+e.message;}}
</script></body></html>
