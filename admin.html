<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VT Dairy Farm - Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f5;
  color:#222;
  padding-bottom:30px;
}

header{
  background:#087a45;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  font-size:25px;
}

header p{
  margin-top:6px;
}

.container{
  width:94%;
  max-width:700px;
  margin:18px auto;
}

.card{
  background:white;
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}

.card h2{
  margin-bottom:12px;
}

.login-card{
  margin-top:35px;
}

.login-title{
  text-align:center;
  color:#087a45;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  color:white;
  padding:13px;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

.green{
  background:#087a45;
}

.red{
  background:#d9534f;
}

.blue{
  background:#2878c8;
}

.orange{
  background:#e09b00;
}

.login-error{
  display:none;
  background:#ffe5e5;
  color:#a33;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}

#adminPanel{
  display:none;
}

.notice{
  background:#fff8d9;
  border-left:5px solid #e0ad00;
  padding:14px;
  border-radius:9px;
  margin-bottom:15px;
  line-height:1.6;
}

.firebase-status{
  background:#e8f1ff;
  color:#24518a;
  border-left:5px solid #2878c8;
  padding:13px;
  border-radius:9px;
  margin-bottom:15px;
  line-height:1.6;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

.stat{
  background:white;
  padding:18px 10px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 8px #0001;
}

.stat-number{
  font-size:26px;
  font-weight:bold;
  color:#087a45;
  margin-bottom:5px;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.product-name{
  font-size:20px;
  font-weight:bold;
}

.status{
  padding:9px;
  border-radius:8px;
  margin:10px 0;
  text-align:center;
  font-weight:bold;
}

.active{
  background:#e7f7ed;
  color:#126b35;
}

.inactive{
  background:#ffe5e5;
  color:#a33;
}

.message{
  display:none;
  padding:13px;
  border-radius:9px;
  background:#e7f7ed;
  color:#126b35;
  margin-bottom:15px;
  font-weight:bold;
  text-align:center;
}

.order{
  border:1px solid #e1e1e1;
  border-radius:10px;
  padding:13px;
  margin-top:10px;
}

.order h3{
  margin-bottom:8px;
}

.order-id{
  background:#f4f7f5;
  padding:9px;
  border-radius:8px;
  margin-bottom:10px;
  font-weight:bold;
  word-break:break-all;
}

.info{
  color:#555;
  line-height:1.7;
  font-size:14px;
}

.items{
  border-top:1px solid #eee;
  margin-top:10px;
  padding-top:8px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.total{
  text-align:right;
  color:#087a45;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.order-status{
  display:block;
  padding:9px;
  border-radius:7px;
  background:#fff3cd;
  color:#856404;
  margin-top:10px;
  font-weight:bold;
  text-align:center;
}

.status-controls{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.status-title{
  font-weight:bold;
  margin-bottom:6px;
}

.empty{
  text-align:center;
  color:#777;
  padding:18px 10px;
}

</style>
</head>

<body>

<header>

<h1>🧑‍💼 VT Dairy Farm</h1>

<p>Admin Panel</p>

</header>


<!-- LOGIN -->

<div id="loginPage">

<div class="container">

<div class="card login-card">

<h2 class="login-title">
🔐 VT Dairy Farm Admin Login
</h2>

<label>
Username
</label>

<input
type="text"
id="adminUsername"
value="admin"
readonly
>

<label>
Password
</label>

<input
type="password"
id="adminPassword"
placeholder="Password डालें"
autocomplete="current-password"
>

<button
class="green"
onclick="adminLogin()"
>
🔐 Login करें
</button>

<div
id="loginError"
class="login-error"
></div>

</div>

</div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

<div class="container">

<div class="notice">

<b>⚙️ Admin Dashboard</b><br>

यहाँ से Products, Rates और Customer Orders संभाल सकते हैं।

</div>


<div
id="firebaseStatus"
class="firebase-status"
>
🔄 Firebase Database से कनेक्शन जाँच रहा है...
</div>


<button
class="red"
onclick="adminLogout()"
>
🚪 Logout
</button>


<div
id="message"
class="message"
></div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div
id="orderCount"
class="stat-number"
>
0
</div>

Orders

</div>


<div class="stat">

<div
id="productCount"
class="stat-number"
>
0
</div>

Products

</div>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>
🥛 Products & Rates
</h2>

<div id="products"></div>

</div>


<!-- CUSTOMER ORDERS -->

<div class="card">

<h2>
📦 Customer Orders
</h2>

<button
class="blue"
onclick="showOrders()"
>
🔄 Online Orders Refresh करें
</button>

<div id="orders"></div>

</div>


</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

apiKey:"AIzaSyD9cwaW54d5VRfK6rbuqSExcz27bFHdSm8",

authDomain:"vt-dairy-farm-9afc8.firebaseapp.com",

projectId:"vt-dairy-farm-9afc8",

storageBucket:"vt-dairy-farm-9afc8.firebasestorage.app",

messagingSenderId:"86012601125",

appId:"1:86012601125:web:6a6d81f5d93aae16a030cc"

};


/* =========================================================
   FIREBASE START
========================================================= */

let db=null;

let firebaseReady=false;


try{

firebase.initializeApp(firebaseConfig);

db=firebase.firestore();

firebaseReady=true;

console.log(
"Firebase Firestore Connected"
);

}catch(error){

console.error(
"Firebase Error:",
error
);

firebaseReady=false;

}


/* =========================================================
   FIREBASE STATUS
========================================================= */

function updateFirebaseStatus(){

const box=
document.getElementById(
"firebaseStatus"
);

if(!box){
return;
}


if(firebaseReady){

box.innerHTML=
"🟢 Firebase Database जुड़ा हुआ है।<br>"+
"दूसरे फोन के Customer Orders यहाँ दिखाई देंगे।";

}else{

box.innerHTML=
"🔴 Firebase Database से कनेक्शन नहीं हुआ।";

}

}


/* =========================================================
   LOGIN DETAILS
========================================================= */

const ADMIN_USERNAME="admin";

const ADMIN_PASSWORD="968091";


/* =========================================================
   LOGIN
========================================================= */

function adminLogin(){

const username=
document.getElementById(
"adminUsername"
).value.trim().toLowerCase();


const password=
document.getElementById(
"adminPassword"
).value.trim();


const errorBox=
document.getElementById(
"loginError"
);


errorBox.style.display="none";


if(
username===ADMIN_USERNAME &&
password===ADMIN_PASSWORD
){

sessionStorage.setItem(
"vtDairyAdminLoggedIn",
"true"
);


document.getElementById(
"loginPage"
).style.display="none";


document.getElementById(
"adminPanel"
).style.display="block";


renderProducts();

showOrders();

window.scrollTo(0,0);

}else{

errorBox.textContent=
"❌ Password गलत है।";

errorBox.style.display="block";

}

}


/* =========================================================
   LOGOUT
========================================================= */

function adminLogout(){

sessionStorage.removeItem(
"vtDairyAdminLoggedIn"
);


document.getElementById(
"adminPanel"
).style.display="none";


document.getElementById(
"loginPage"
).style.display="block";


document.getElementById(
"adminPassword"
).value="";


window.scrollTo(0,0);

}


/* =========================================================
   CHECK LOGIN
========================================================= */

function checkAdminLogin(){

const loggedIn=
sessionStorage.getItem(
"vtDairyAdminLoggedIn"
);


if(loggedIn==="true"){

document.getElementById(
"loginPage"
).style.display="none";


document.getElementById(
"adminPanel"
).style.display="block";


renderProducts();

showOrders();

}else{

document.getElementById(
"loginPage"
).style.display="block";


document.getElementById(
"adminPanel"
).style.display="none";

}

}


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" &&
document.getElementById(
"loginPage"
).style.display!=="none"
){

adminLogin();

}

}
);


/* =========================================================
   PRODUCTS
========================================================= */

const defaultProducts=[

{
id:"milk",
name:"दूध",
price:80,
unit:"लीटर",
active:true
},

{
id:"ghee",
name:"घी",
price:0,
unit:"किलो",
active:false
},

{
id:"paneer",
name:"पनीर",
price:0,
unit:"किलो",
active:false
},

{
id:"mawa",
name:"मावा",
price:0,
unit:"किलो",
active:false
}

];


/* =========================================================
   GET PRODUCTS
========================================================= */

function getProducts(){

try{

const saved=
JSON.parse(
localStorage.getItem(
"vtDairyProducts"
)
);


if(
Array.isArray(saved) &&
saved.length>0
){

return saved;

}

}catch(error){

console.log(error);

}


localStorage.setItem(
"vtDairyProducts",
JSON.stringify(
defaultProducts
)
);


return defaultProducts;

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

const box=
document.getElementById(
"products"
);


if(!box){
return;
}


const products=
getProducts();


box.innerHTML="";


products.forEach(
function(product){

const statusText=
product.active
?
"🟢 Product चालू है"
:
"🔴 Product बंद है";


const statusClass=
product.active
?
"active"
:
"inactive";


const buttonText=
product.active
?
"🔴 Product बंद करें"
:
"🟢 Product चालू करें";


const buttonClass=
product.active
?
"red"
:
"green";


box.innerHTML+=`

<div class="product">

<div class="product-name">

${escapeHTML(product.name)}

</div>


<div class="status ${statusClass}">

${statusText}

</div>


<label>

Rate (₹ / ${escapeHTML(product.unit)})

</label>


<input
type="number"
min="0"
step="1"
id="price_${escapeHTML(product.id)}"
value="${Number(product.price)||0}"
>


<button
class="${buttonClass}"
onclick="toggleProduct(
'${escapeJS(product.id)}'
)"
>

${buttonText}

</button>


<button
class="blue"
onclick="saveProduct(
'${escapeJS(product.id)}'
)"
>

💾 Rate Save करें

</button>

</div>

`;

}
);


updateProductCount();

}


/* =========================================================
   SAVE PRODUCT RATE
========================================================= */

function saveProduct(id){

const products=
getProducts();


const index=
products.findIndex(
function(product){

return product.id===id;

}
);


if(index===-1){

alert(
"Product नहीं मिला।"
);

return;

}


const input=
document.getElementById(
"price_"+id
);


const price=
Number(input.value);


if(
isNaN(price) ||
price<0
){

alert(
"सही Rate डालें।"
);

return;

}


products[index].price=
price;


localStorage.setItem(
"vtDairyProducts",
JSON.stringify(products)
);


showMessage(
"✅ "+
products[index].name+
" का Rate Save हो गया।"
);


renderProducts();

}


/* =========================================================
   TOGGLE PRODUCT
========================================================= */

function toggleProduct(id){

const products=
getProducts();


const index=
products.findIndex(
function(product){

return product.id===id;

}
);


if(index===-1){

alert(
"Product नहीं मिला।"
);

return;

}


products[index].active=
!products[index].active;


localStorage.setItem(
"vtDairyProducts",
JSON.stringify(products)
);


showMessage(

products[index].name+

(
products[index].active
?
" 🟢 चालू कर दिया गया।"
:
" 🔴 बंद कर दिया गया।"
)

);


renderProducts();

}


/* =========================================================
   PRODUCT COUNT
========================================================= */

function updateProductCount(){

const products=
getProducts();


const activeProducts=
products.filter(
function(product){

return(
product.active &&
Number(product.price)>0
);

}
);


const box=
document.getElementById(
"productCount"
);


if(box){

box.textContent=
activeProducts.length;

}

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

const box=
document.getElementById(
"message"
);


if(!box){
return;
}


box.textContent=
text;


box.style.display="block";


setTimeout(
function(){

box.style.display="none";

},
2500
);

}


/* =========================================================
   LOCAL ORDERS
========================================================= */

function getLocalOrders(){

try{

const saved=
JSON.parse(
localStorage.getItem(
"vtDairyOrders"
)
);


if(Array.isArray(saved)){

return saved;

}

}catch(error){

console.log(error);

}


return [];

}


/* =========================================================
   FIREBASE ORDERS
========================================================= */

async function getFirebaseOrders(){

if(!firebaseReady || !db){

return [];

}


try{

const snapshot=
await db
.collection("orders")
.get();


const orders=[];


snapshot.forEach(
function(doc){

const data=
doc.data();


if(data){

orders.push(data);

}

}
);


orders.sort(
function(a,b){

const timeA=
a.createdAt
?
new Date(a.createdAt).getTime()
:
0;


const timeB=
b.createdAt
?
new Date(b.createdAt).getTime()
:
0;


return timeB-timeA;

}
);


return orders;

}catch(error){

console.error(
"Firebase Orders Error:",
error
);


return [];

}

}


/* =========================================================
   SHOW ORDERS
========================================================= */

async function showOrders(){

const box=
document.getElementById(
"orders"
);


const count=
document.getElementById(
"orderCount"
);


if(!box){
return;
}


box.innerHTML=`

<div class="empty">

🔄 Online Orders लोड हो रहे हैं...

</div>

`;


let orders=[];


/* पहले Firebase से */

if(firebaseReady){

orders=
await getFirebaseOrders();

}


/* Firebase में Orders नहीं मिले तो LocalStorage */

if(orders.length===0){

orders=
getLocalOrders();

}


/* Count */

if(count){

count.textContent=
orders.length;

}


box.innerHTML="";


if(orders.length===0){

box.innerHTML=`

<div class="empty">

📦 अभी कोई Customer Order नहीं मिला।

<br><br>

दूसरे फोन से नया Order करके

<br>

यहाँ "Online Orders Refresh करें" दबाएँ।

</div>

`;

return;

}


/* Orders दिखाएँ */

orders.forEach(
function(order){

box.innerHTML+=createOrderHTML(order);

}
);

}


/* =========================================================
   ORDER HTML
========================================================= */

function createOrderHTML(order){

let itemsHTML="";


if(
Array.isArray(order.items) &&
order.items.length>0
){

order.items.forEach(
function(item){

itemsHTML+=`

<div class="item">

<span>

${escapeHTML(
item.name ||
"Product"
)}

× ${Number(
item.quantity
)||1}

${escapeHTML(
item.unit ||
""
)}

</span>


<span>

₹${Number(
item.price
)||0}

</span>

</div>

`;

}
);

}else{

itemsHTML=`

<div class="empty">

Order में Product की जानकारी नहीं मिली।

</div>

`;

}


const total=
Number(order.total) ||
Number(order.order_total) ||
0;


const status=
order.status ||
"Pending";


return`

<div class="order">

<div class="order-id">

Order ID:
${escapeHTML(
order.id ||
"नहीं है"
)}

</div>


<h3>

👤

${escapeHTML(
order.customerName ||
order.name ||
"Customer"
)}

</h3>


<div class="info">

📞

${escapeHTML(
order.phone ||
"नहीं है"
)}

<br>

📍

${escapeHTML(
order.address ||
"नहीं है"
)}

<br>

📅

${escapeHTML(
order.date ||
"नहीं है"
)}

<br>

🕐

${escapeHTML(
order.time ||
"नहीं है"
)}

</div>


<div class="items">

${itemsHTML}

</div>


<div class="total">

कुल: ₹${total}

</div>


<div class="order-status">

वर्तमान Status:
${escapeHTML(status)}

</div>


<div class="status-controls">

<div class="status-title">

📦 Order Status बदलें

</div>


<button
class="orange"
onclick="updateOrderStatus(
'${escapeJS(order.id||"")}',
'Pending'
)"
>

🕐 Pending

</button>


<button
class="blue"
onclick="updateOrderStatus(
'${escapeJS(order.id||"")}',
'Confirmed'
)"
>

✅ Confirmed

</button>


<button
class="green"
onclick="updateOrderStatus(
'${escapeJS(order.id||"")}',
'Delivered'
)"
>

🚚 Delivered

</button>


<button
class="red"
onclick="updateOrderStatus(
'${escapeJS(order.id||"")}',
'Cancelled'
)"
>

❌ Cancelled

</button>


</div>


</div>

`;

}


/* =========================================================
   UPDATE FIREBASE ORDER STATUS
========================================================= */

async function updateOrderStatus(
orderId,
newStatus
){

if(!orderId){

alert(
"Order ID नहीं मिला।"
);

return;

}


if(firebaseReady && db){

try{

await db
.collection("orders")
.doc(orderId)
.update({

status:newStatus

});


showMessage(
"✅ Online Order का Status "+
newStatus+
" कर दिया गया।"
);


await showOrders();

return;

}catch(error){

console.error(
"Firebase Status Update Error:",
error
);

}

}


/* Local fallback */

const orders=
getLocalOrders();


const index=
orders.findIndex(
function(order){

return String(order.id)===
String(orderId);

}
);


if(index===-1){

alert(
"Order नहीं मिला।"
);

return;

}


orders[index].status=
newStatus;


localStorage.setItem(
"vtDairyOrders",
JSON.stringify(orders)
);


showMessage(
"✅ Order Status बदलकर "+
newStatus+
" कर दिया गया।"
);


showOrders();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

const div=
document.createElement(
"div"
);


div.textContent=
String(value);


return div.innerHTML;

}


/* =========================================================
   ESCAPE JAVASCRIPT
========================================================= */

function escapeJS(value){

return String(value)

.replace(
/\\/g,
"\\\\"
)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
'\\"'
)

.replace(
/\n/g,
"\\n"
)

.replace(
/\r/g,
"\\r"
);

}


/* =========================================================
   START
========================================================= */

updateFirebaseStatus();

checkAdminLogin();

</script>

</body>
</html>
