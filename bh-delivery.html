<!DOCTYPE html><html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f1b1c">
<meta name="description" content="BH Delivery Boy App">
<title>BH Delivery</title>
<link rel="manifest" href="./bh-delivery-manifest.json"><style>
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:Arial,sans-serif;background:#f1f6f2;color:#173629}
header{background:#1f1b1c;color:white;padding:18px;border-radius:14px;margin-bottom:14px;text-align:center}
.logo{width:100px;height:100px;object-fit:contain;background:white;border-radius:18px;padding:5px;margin-bottom:10px}
h1{font-size:23px;margin:0 0 8px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;font-size:16px}
input{border:1px solid #bbb}
button{border:0;background:#1f1b1c;color:white;font-weight:bold}
button:disabled{opacity:.6}
.secondary{background:#455a64}
.error{color:#b00020;white-space:pre-wrap}
.good{color:#087a45}
.small{font-size:13px;color:#555}
.hidden{display:none}
a{color:#087a45;font-weight:bold}
hr{margin:18px 0;border:0;border-top:1px solid #ddd}
</style></head><body><header>
<img class="logo" src="./bh-icon-192.png" alt="BH Delivery Logo">
<h1>BH Delivery</h1>
<p>डिलीवरी बॉय पैनल</p>
</header><section class="card" id="authBox">
<h2>रजिस्ट्रेशन / लॉगिन</h2>
<p class="small">यूज़रनेम और पासवर्ड से लॉगिन करें। अकाउंट एडमिन से मंजूर होने के बाद ही ऑर्डर दिखेंगे।</p><h3>नया अकाउंट</h3>
<form id="registerForm">
<input id="regUsername" placeholder="यूज़रनेम (3–24 अक्षर)" minlength="3" maxlength="24" autocomplete="username" required>
<input id="regDisplayName" placeholder="आपका नाम" maxlength="80" autocomplete="name" required>
<input id="regPassword" type="password" placeholder="पासवर्ड (कम से कम 6 अक्षर)" minlength="6" autocomplete="new-password" required>
<button id="registerBtn" type="submit">रजिस्ट्रेशन करें</button>
</form><hr><h3>पहले से अकाउंट है</h3>
<form id="loginForm">
<input id="loginUsername" placeholder="यूज़रनेम" autocomplete="username" required>
<input id="loginPassword" type="password" placeholder="पासवर्ड" autocomplete="current-password" required>
<button id="loginBtn" type="submit">लॉगिन करें</button>
</form>
<p id="authMessage" class="error"></p>
</section><section id="pendingBox" class="card hidden">
<h2>मंजूरी बाकी है</h2>
<p id="pendingText">एडमिन की मंजूरी के बाद ऑर्डर दिखेंगे।</p>
<button id="pendingLogout" class="secondary" type="button">Logout</button>
</section><section id="panel" class="hidden">
<div class="card">
<h2>मेरे ऑर्डर</h2>
<p id="signedIn" class="small"></p>
<button id="refreshBtn" type="button">ऑर्डर Refresh करें</button>
<button id="logoutBtn" class="secondary" type="button">Logout</button>
<p id="message" class="error"></p>
</div>
<div id="orders"></div>
</section><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
const firebaseConfig = {
  apiKey: "AIzaSyD9cwaW54d5VRfK6rbuqSExcz27bFHdSm8",
  authDomain: "vt-dairy-farm-9afc8.firebaseapp.com",
  projectId: "vt-dairy-farm-9afc8",
  storageBucket: "vt-dairy-farm-9afc8.firebasestorage.app",
  messagingSenderId: "86012601125",
  appId: "1:86012601125:web:6a6d81f5d93aae16a030cc"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const DOMAIN = "@delivery.vtdairyfarm.com";

let currentUser = null;
let profile = null;
let busy = false;
let authCheck = false;

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function mail(u) {
  return u.trim().toLowerCase() + DOMAIN;
}

function valid(u) {
  return /^[a-z0-9._-]{3,24}$/.test(u);
}

function view(v) {
  $("authBox").classList.toggle("hidden", v !== "auth");
  $("pendingBox").classList.toggle("hidden", v !== "pending");
  $("panel").classList.toggle("hidden", v !== "panel");
}

$("registerForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (authCheck) return;

  const u = $("regUsername").value.trim().toLowerCase();
  const name = $("regDisplayName").value.trim();
  const p = $("regPassword").value;

  if (!valid(u)) {
    $("authMessage").textContent =
      "यूज़रनेम 3–24 अक्षर का हो; a-z, 0-9, dot, underscore या hyphen इस्तेमाल करें।";
    return;
  }

  if (!name) {
    $("authMessage").textContent = "अपना नाम लिखें।";
    return;
  }

  $("authMessage").textContent = "रजिस्ट्रेशन हो रहा है...";
  $("registerBtn").disabled = true;
  $("loginBtn").disabled = true;

  let createdUser = null;

  try {
    const credential = await auth.createUserWithEmailAndPassword(mail(u), p);
    createdUser = credential.user;

    await db.collection("deliveryUsers").doc(createdUser.uid).set({
      uid: createdUser.uid,
      username: u,
      displayName: name,
      email: mail(u),
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    $("authMessage").textContent =
      "रजिस्ट्रेशन हो गया। अब एडमिन की मंजूरी का इंतजार करें।";

  } catch (e) {
    $("authMessage").textContent =
      createdUser
        ? "अकाउंट बन गया, लेकिन प्रोफाइल सेव नहीं हुई। एडमिन से संपर्क करें।"
        : "रजिस्ट्रेशन नहीं हुआ: " + e.message;
  } finally {
    $("registerBtn").disabled = false;
    $("loginBtn").disabled = false;
  }
});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const u = $("loginUsername").value.trim().toLowerCase();

  if (!valid(u)) {
    $("authMessage").textContent = "यूज़रनेम सही लिखें।";
    return;
  }

  $("authMessage").textContent = "लॉगिन हो रहा है...";
  $("loginBtn").disabled = true;
  $("registerBtn").disabled = true;

  try {
    await auth.signInWithEmailAndPassword(
      mail(u),
      $("loginPassword").value
    );
    $("authMessage").textContent = "";
  } catch (e) {
    $("authMessage").textContent =
      "लॉगिन नहीं हुआ। यूज़रनेम और पासवर्ड जाँचें।";
  } finally {
    $("loginBtn").disabled = false;
    $("registerBtn").disabled = false;
  }
});

auth.onAuthStateChanged(async u => {
  if (authCheck) return;
  authCheck = true;

  currentUser = u;
  profile = null;

  try {
    if (!u) {
      view("auth");
      $("orders").innerHTML = "";
      $("signedIn").textContent = "";
      authCheck = false;
      return;
    }

    const s = await db.collection("deliveryUsers").doc(u.uid).get();

    if (!s.exists) {
      await auth.signOut();
      view("auth");
      $("authMessage").textContent = "अकाउंट रिकॉर्ड नहीं मिला।";
      authCheck = false;
      return;
    }

    profile = s.data();

    if (profile.status !== "approved") {
      view("pending");
      $("pendingText").textContent =
        profile.status === "rejected"
          ? "अकाउंट मंजूर नहीं हुआ। एडमिन से संपर्क करें।"
          : "अकाउंट बना है। एडमिन की मंजूरी के बाद ही ऑर्डर दिखेंगे।";

      authCheck = false;
      return;
    }

    view("panel");
    $("signedIn").textContent =
      "लॉगिन: " + (profile.displayName || profile.username);

    authCheck = false;
    await loadOrders();

  } catch (e) {
    view("auth");
    $("authMessage").textContent = "अकाउंट जाँच नहीं सका: " + e.message;
    authCheck = false;
  }
});

$("logoutBtn").onclick = $("pendingLogout").onclick = async () => {
  try {
    await auth.signOut();
  } catch (e) {
    $("message").textContent = "Logout नहीं हुआ: " + e.message;
  }
};

$("refreshBtn").onclick = loadOrders;

async function loadOrders() {
  if (!currentUser || !profile || profile.status !== "approved" || busy) {
    return;
  }

  busy = true;
  $("message").textContent = "";
  $("orders").innerHTML =
    '<div class="card">ऑर्डर लोड हो रहे हैं...</div>';

  try {
    const snap = await db.collection("orders")
      .where("assignedToEmail", "==", currentUser.email)
      .get();

    const docs = snap.docs;

    docs.sort((a, b) => {
      const x = a.data().createdAt;
      const y = b.data().createdAt;

      return (y && y.toMillis ? y.toMillis() : 0) -
             (x && x.toMillis ? x.toMillis() : 0);
    });

    if (!docs.length) {
      $("orders").innerHTML =
        '<div class="card">अभी कोई ऑर्डर असाइन नहीं है। एडमिन से असाइन करवाएँ और Refresh करें।</div>';
      return;
    }

    $("orders").innerHTML = docs.map(renderOrder).join("");

  } catch (e) {
    $("orders").innerHTML =
      '<div class="card error">ऑर्डर लोड नहीं हुए: ' +
      esc(e.message) + '</div>';
  } finally {
    busy = false;
  }
}

function renderOrder(d) {
  const o = d.data();
  const s = String(o.status || "Pending");
  const low = s.toLowerCase();
  const cancel = low === "cancelled" || low === "cancel";
  const del = low === "delivered";

  const items = Array.isArray(o.items)
    ? o.items.map(i =>
        esc(i.name || i.productName || "सामान") +
        " × " + esc(i.quantity ?? i.qty ?? 1)
      ).join("<br>")
    : esc(o.items || "—");

  const has =
    o.latitude != null &&
    o.longitude != null &&
    o.latitude !== "" &&
    o.longitude !== "" &&
    Number.isFinite(Number(o.latitude)) &&
    Number.isFinite(Number(o.longitude));

  const map = has
    ? "https://www.google.com/maps?q=" +
      encodeURIComponent(o.latitude + "," + o.longitude)
    : "";

  return `<div class="card">
    <h3>ऑर्डर: ${esc(o.id || d.id)}</h3>
    <p><b>ग्राहक:</b> ${esc(o.customerName || o.name || "—")}</p>
    <p><b>फोन:</b> ${esc(o.phone || "—")}</p>
    <p><b>पता:</b> ${esc(o.address || "—")}</p>
    <p><b>सामान:</b><br>${items}</p>
    <p><b>रकम:</b> ₹${esc(o.total ?? 0)}</p>
    <p><b>भुगतान:</b> ${esc(o.paymentMethod || "Cash")}</p>
    <p><b>स्थिति:</b>
      <span class="${cancel ? "error" : "good"}">
        ${cancel ? "Cancel" : esc(s)}
      </span>
    </p>
    ${map ? `<p><a href="${map}" target="_blank" rel="noopener">📍 ग्राहक की लोकेशन खोलें</a></p>` : ""}
    ${!cancel && !del
      ? `<button type="button" onclick="completeDelivery('${esc(d.id)}',this)">डिलीवरी पूरी करें</button>`
      : ""}
  </div>`;
}

async function completeDelivery(id, b) {
  if (!currentUser || !profile || profile.status !== "approved") return;

  if (!confirm("क्या यह ऑर्डर ग्राहक को दे दिया गया है?")) return;

  b.disabled = true;
  b.textContent = "अपडेट हो रहा है...";

  try {
    const orderRef = db.collection("orders").doc(id);
    const noteRef = db.collection("notificationRequests").doc();

    await db.runTransaction(async tx => {
      const s = await tx.get(orderRef);

      if (!s.exists) throw Error("ऑर्डर नहीं मिला।");

      const o = s.data();

      if (
        (o.assignedToEmail || "").toLowerCase() !==
        (currentUser.email || "").toLowerCase()
      ) {
        throw Error("यह ऑर्डर आपको असाइन नहीं है।");
      }

      if (["delivered", "cancelled", "cancel"].includes(
        String(o.status || "").toLowerCase()
      )) {
        throw Error("ऑर्डर पहले ही डिलीवर या कैंसल हो चुका है।");
      }

      tx.update(orderRef, {
        status: "Delivered",
        deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
        deliveredBy: profile.username,
        deliveredByEmail: currentUser.email,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      tx.set(noteRef, {
        type: "delivery_completed",
        orderId: id,
        customerName: o.customerName || o.name || "",
        customerPhone: o.phone || "",
        deliveryBoyUsername: profile.username,
        deliveryBoyEmail: currentUser.email,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    $("message").textContent =
      "डिलीवरी पूरी हुई और एडमिन के पैनल के लिए सूचना सेव हो गई।";

    await loadOrders();

  } catch (e) {
    $("message").textContent = "अपडेट नहीं हुआ: " + e.message;
    b.disabled = false;
    b.textContent = "डिलीवरी पूरी करें";
  }
}

window.completeDelivery = completeDelivery;

/*
  ग्राहक ऐप और BH Delivery एक ही GitHub Pages पाथ पर हैं।
  इसलिए यहाँ नया root-scope Service Worker रजिस्टर नहीं किया जाता।
  इससे ग्राहक ऐप के Service Worker को बदलने का जोखिम नहीं होगा।
*/

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registrations = await navigator.serviceWorker.getRegistrations();

      for (const registration of registrations) {
        const worker =
          registration.active ||
          registration.waiting ||
          registration.installing;

        if (
          worker &&
          new URL(worker.scriptURL).pathname.endsWith("/bh-delivery-sw.js")
        ) {
          await registration.unregister();
        }
      }
    } catch (e) {
      console.warn("Service Worker जाँच:", e);
    }
  });
}
</script></body>
</html>
