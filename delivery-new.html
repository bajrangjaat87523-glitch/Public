<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087a45">
<title>VT Dairy Farm Delivery</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:Arial,sans-serif;background:#f1f6f2;color:#173629}
header{background:#087a45;color:white;padding:20px;border-radius:14px;margin-bottom:15px}
h1{font-size:23px;margin:0 0 8px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
input,button{width:100%;padding:13px;margin-top:10px;border-radius:8px;font-size:16px}
input{border:1px solid #bbb}
button{border:0;background:#087a45;color:white;font-weight:bold}
button:disabled{opacity:.55}
.secondary{background:#455a64}
.error{color:#b00020;white-space:pre-wrap}
.status{font-weight:bold;color:#087a45}
.cancelled{color:#b00020}
.small{font-size:13px;color:#555}
.hidden{display:none}
a{color:#087a45;font-weight:bold}
</style>
</head>

<body>
<header>
<h1>🚚 VT Dairy Farm Delivery</h1>
<p>डिलीवरी बॉय पैनल</p>
</header>

<section class="card" id="loginBox">
<h2>डिलीवरी लॉगिन</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Delivery Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login करें</button>
</form>
<p id="loginMessage" class="error"></p>
</section>

<section id="panel" class="hidden">
<div class="card">
<h2>मेरे ऑर्डर</h2>
<p id="signedIn" class="small"></p>
<button id="refreshBtn">ऑर्डर Refresh करें</button>
<button id="logoutBtn" class="secondary">Logout</button>
<p id="message" class="error"></p>
</div>
<div id="orders"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9cwaW54d5VRfK6rbuqSExcz27bFHdSm8",
  authDomain: "vt-dairy-farm-9afc8.firebaseapp.com",
  projectId: "vt-dairy-farm-9afc8",
  storageBucket: "vt-dairy-farm-9afc8.firebasestorage.app",
  messagingSenderId: "86012601125",
  appId: "1:86012601125:web:6a6d81f5d93aae16a030cc"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);

let currentUser = null;
let loading = false;

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMessage").textContent = "लॉगिन हो रहा है...";

  try {
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    $("loginMessage").textContent = "";
  } catch(err) {
    $("loginMessage").textContent = "लॉगिन नहीं हुआ: " + err.message;
  }
});

auth.onAuthStateChanged(async user => {
  currentUser = user;
  $("loginBox").classList.toggle("hidden", !!user);
  $("panel").classList.toggle("hidden", !user);

  if(user){
    $("signedIn").textContent = "लॉगिन: " + user.email;
    await loadOrders();
  } else {
    $("orders").innerHTML = "";
  }
});

$("logoutBtn").onclick = () => auth.signOut();
$("refreshBtn").onclick = loadOrders;

async function loadOrders(){
  if(!currentUser || loading) return;

  loading = true;
  $("message").textContent = "";
  $("orders").innerHTML = '<div class="card">ऑर्डर लोड हो रहे हैं...</div>';

  try {
    const email = (currentUser.email || "").toLowerCase();

    const snapshot = await db.collection("orders")
      .where("assignedToEmail", "==", currentUser.email)
      .get();

    const docs = snapshot.docs.filter(doc => {
      const o = doc.data();
      return (o.assignedToEmail || "").toLowerCase() === email;
    });

    docs.sort((a,b) => {
      const av = a.data().createdAt;
      const bv = b.data().createdAt;
      const at = av && av.toMillis ? av.toMillis() : 0;
      const bt = bv && bv.toMillis ? bv.toMillis() : 0;
      return bt - at;
    });

    if(!docs.length){
      $("orders").innerHTML =
        '<div class="card">अभी आपके ईमेल पर कोई ऑर्डर असाइन नहीं है।<br><br>एडमिन से ऑर्डर असाइन करवाएँ और Refresh करें।</div>';
      return;
    }

    $("orders").innerHTML = docs.map(renderOrder).join("");

  } catch(err) {
    $("orders").innerHTML =
      '<div class="card error">ऑर्डर लोड नहीं हुए।<br>' +
      safe(err.message) +
      '<br><br>Firebase Firestore Rules और assignedToEmail की जाँच जरूरी है।</div>';
  } finally {
    loading = false;
  }
}

function renderOrder(doc){
  const o = doc.data();
  const status = String(o.status || "Pending").trim();

  // कैंसल ऑर्डर के लिए केवल Cancel दिखाएँ।
  const isCancelled = status.toLowerCase() === "cancelled";
  const isDelivered = status.toLowerCase() === "delivered";
  const displayStatus = isCancelled ? "Cancel" : status;
  const statusClass = isCancelled ? "status cancelled" : "status";
  const finished = isDelivered || isCancelled;

  let items = "विवरण उपलब्ध नहीं";

  if(Array.isArray(o.items)){
    items = o.items.map(i =>
      safe(i.name || i.productName || "सामान") +
      " × " +
      safe(i.quantity ?? i.qty ?? 1)
    ).join("<br>");
  } else if(typeof o.items === "string"){
    items = safe(o.items);
  }

  const lat = o.latitude;
  const lng = o.longitude;

  const hasLocation = lat !== undefined && lat !== null &&
    lng !== undefined && lng !== null &&
    lat !== "" && lng !== "" &&
    Number.isFinite(Number(lat)) && Number.isFinite(Number(lng));

  const mapUrl = hasLocation
    ? "https://www.google.com/maps?q=" +
      encodeURIComponent(lat + "," + lng)
    : "";

  return `
  <div class="card">
    <h3>ऑर्डर: ${safe(o.id || doc.id)}</h3>
    <p><b>ग्राहक:</b> ${safe(o.customerName || o.name || "—")}</p>
    <p><b>फोन:</b> ${safe(o.phone || "—")}</p>
    <p><b>पता:</b> ${safe(o.address || "—")}</p>
    <p><b>सामान:</b><br>${items}</p>
    <p><b>रकम:</b> ₹${safe(o.total ?? 0)}</p>
    <p><b>भुगतान:</b> ${safe(o.paymentMethod || "Cash")}</p>
    <p><b>स्थिति:</b> <span class="${statusClass}">${safe(displayStatus)}</span></p>
    ${mapUrl ? `<p><a href="${mapUrl}" target="_blank" rel="noopener">📍 ग्राहक की लोकेशन खोलें</a></p>` : ""}
    ${!finished ? `<button onclick="completeDelivery('${safe(doc.id)}',this)">डिलीवरी पूरी करें</button>` : ""}
  </div>`;
}

async function completeDelivery(docId, button){
  if(!currentUser) return;

  if(!confirm("क्या यह ऑर्डर ग्राहक को दे दिया गया है?")) return;

  button.disabled = true;
  button.textContent = "अपडेट हो रहा है...";

  try {
    const ref = db.collection("orders").doc(docId);

    await db.runTransaction(async transaction => {
      const snapshot = await transaction.get(ref);

      if(!snapshot.exists) throw new Error("ऑर्डर नहीं मिला।");

      const o = snapshot.data();
      const assigned = (o.assignedToEmail || "").toLowerCase();
      const email = (currentUser.email || "").toLowerCase();

      if(assigned !== email){
        throw new Error("यह ऑर्डर आपके ईमेल पर असाइन नहीं है।");
      }

      const status = String(o.status || "").toLowerCase();

      if(status === "delivered" || status === "cancelled"){
        throw new Error("ऑर्डर पहले ही डिलीवर या कैंसल हो चुका है।");
      }

      transaction.update(ref, {
        status: "Delivered",
        deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
        deliveredByEmail: currentUser.email
      });
    });

    $("message").textContent = "डिलीवरी पूरी हो गई।";
    await loadOrders();

  } catch(err) {
    $("message").textContent = "अपडेट नहीं हुआ: " + err.message;
    button.disabled = false;
    button.textContent = "डिलीवरी पूरी करें";
  }
}

window.completeDelivery = completeDelivery;
</script>
</body>
</html>
