<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087a45">
<link rel="manifest" href="./delivery-manifest.json">
<title>VT Dairy Farm - Delivery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7f5;color:#183328;padding:16px}
header{background:#087a45;color:white;padding:20px;border-radius:14px;margin-bottom:16px}
h1{font-size:23px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#087a45;color:white;font-weight:bold}
button:disabled{opacity:.6}
.secondary{background:#455a64}
.order-title{font-size:18px;font-weight:bold;margin-bottom:8px}
.status{font-weight:bold;color:#087a45}
.error{color:#b00020;white-space:pre-wrap;margin-top:10px}
.small{font-size:13px;color:#555;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🚚 VT Dairy Farm Delivery</h1>
<p style="margin-top:8px">डिलीवरी बॉय पैनल</p>
</header>

<section class="card" id="loginBox">
<h2>Delivery Boy Login</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Delivery Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login करें</button>
</form>
<div id="loginError" class="error"></div>
</section>

<section id="panel" class="hidden">
<div class="card">
<h2>डिलीवरी पैनल</h2>
<p id="signedIn" class="small"></p>
<button id="notifyBtn">🔔 Notifications चालू करें</button>
<button id="installBtn" class="secondary hidden">📲 ऐप Install करें</button>
<button id="refreshBtn" class="secondary">ऑर्डर Refresh करें</button>
<button id="logoutBtn" class="secondary">Logout</button>
<div id="message" class="small"></div>
</div>
<div id="orders"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9cwaW54d5VRfK6rbuqSExcz27bFHdSm8",
  authDomain: "vt-dairy-farm-9afc8.firebaseapp.com",
  projectId: "vt-dairy-farm-9afc8",
  storageBucket: "vt-dairy-farm-9afc8.firebasestorage.app",
  messagingSenderId: "86012601125",
  appId: "1:86012601125:web:6a6d81f5d93aae16a030cc"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let messaging = null;
let installPrompt = null;

try {
  messaging = firebase.messaging();
} catch (e) {
  console.log("Messaging उपलब्ध नहीं है", e);
}

const $ = id => document.getElementById(id);

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginError").textContent = "Login हो रहा है...";
  try {
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    $("loginError").textContent = "";
  } catch (e) {
    $("loginError").textContent = "Login असफल: " + e.message;
  }
});

auth.onAuthStateChanged(async user => {
  currentUser = user;
  $("loginBox").classList.toggle("hidden", !!user);
  $("panel").classList.toggle("hidden", !user);

  if (user) {
    $("signedIn").textContent = "Login: " + (user.email || "");
    await loadOrders();
  }
});

$("logoutBtn").onclick = () => auth.signOut();

$("refreshBtn").onclick = loadOrders;

$("notifyBtn").onclick = setupNotifications;

async function setupNotifications() {
  if (!currentUser) return;

  if (!("Notification" in window)) {
    $("message").textContent = "इस ब्राउज़र में Notifications उपलब्ध नहीं हैं।";
    return;
  }

  try {
    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      $("message").textContent = "Notification अनुमति नहीं मिली।";
      return;
    }

    if (!messaging) {
      $("message").textContent = "Firebase Messaging उपलब्ध नहीं है।";
      return;
    }

    const registration = await navigator.serviceWorker.register(
      "./firebase-messaging-sw.js"
    );

    const vapidKey =
      "BKNYUkxK4_hpL870JUGLhmEV9G9VMrLYikpR9wFVFocwDo8nZAYtqVT6BscJ9hhjfdcxCmcYJ1UrkeTZiNKuv_c";

    const token = await messaging.getToken({
      vapidKey,
      serviceWorkerRegistration: registration
    });

    if (!token) {
      $("message").textContent = "Notification token नहीं मिला।";
      return;
    }

    await db.collection("notificationTokens").doc(token).set({
      token: token,
      type: "delivery",
      deliveryEmail: currentUser.email,
      uid: currentUser.uid,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    localStorage.setItem("vtDairyDeliveryNotificationToken", token);
    $("message").textContent =
      "Notifications चालू हैं। Push भेजने के लिए sender backend भी जरूरी है।";

    messaging.onMessage(payload => {
      const n = payload.notification || {};
      if (Notification.permission === "granted") {
        new Notification(n.title || "VT Dairy Farm", {
          body: n.body || "आपके लिए नया संदेश है।",
          icon: "./icon-192.png"
        });
      }
      loadOrders();
    });
  } catch (e) {
    $("message").textContent = "Notification समस्या: " + e.message;
  }
}

async function loadOrders() {
  if (!currentUser) return;

  $("orders").innerHTML =
    '<div class="card">ऑर्डर लोड हो रहे हैं...</div>';

  try {
    const snapshot = await db.collection("orders")
      .where("assignedToEmail", "==", currentUser.email)
      .get();

    if (snapshot.empty) {
      $("orders").innerHTML =
        '<div class="card">अभी आपके नाम कोई ऑर्डर असाइन नहीं है।</div>';
      return;
    }

    const docs = snapshot.docs.slice().sort((a, b) => {
      const av = a.data().createdAt;
      const bv = b.data().createdAt;
      const at = av && av.toMillis ? av.toMillis() : 0;
      const bt = bv && bv.toMillis ? bv.toMillis() : 0;
      return bt - at;
    });

    $("orders").innerHTML = docs.map(doc => renderOrder(doc)).join("");
  } catch (e) {
    $("orders").innerHTML =
      '<div class="card error">ऑर्डर लोड नहीं हुए: ' +
      escapeHTML(e.message) + '</div>';
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderOrder(doc) {
  const o = doc.data();
  const status = o.status || "Pending";
  const items = Array.isArray(o.items)
    ? o.items.map(i =>
        `${escapeHTML(i.name || i.productName || "Product")} × ${escapeHTML(i.quantity ?? i.qty ?? 1)}`
      ).join("<br>")
    : escapeHTML(o.items || "विवरण उपलब्ध नहीं");

  const location = Number.isFinite(Number(o.latitude)) &&
    Number.isFinite(Number(o.longitude)) &&
    o.latitude !== "" && o.longitude !== ""
      ? `https://www.google.com/maps?q=${encodeURIComponent(o.latitude)},${encodeURIComponent(o.longitude)}`
      : "";

  const isFinished = ["Delivered", "Cancelled"].includes(status);

  return `
    <div class="card">
      <div class="order-title">ऑर्डर: ${escapeHTML(o.id || doc.id)}</div>
      <p><b>ग्राहक:</b> ${escapeHTML(o.customerName || o.name || "—")}</p>
      <p><b>फोन:</b> ${escapeHTML(o.phone || "—")}</p>
      <p><b>पता:</b> ${escapeHTML(o.address || "—")}</p>
      <p><b>सामान:</b><br>${items}</p>
      <p><b>रकम:</b> ₹${escapeHTML(o.total ?? 0)}</p>
      <p><b>भुगतान:</b> ${escapeHTML(o.paymentMethod || "Cash")}</p>
      <p><b>स्थिति:</b> <span class="status">${escapeHTML(status)}</span></p>
      ${location ? `<p style="margin-top:10px"><a href="${location}" target="_blank" rel="noopener">📍 ग्राहक की लोकेशन खोलें</a></p>` : ""}
      ${!isFinished ? `<button onclick="completeDelivery('${doc.id}')">डिलीवरी पूरी करें</button>` : ""}
    </div>`;
}

async function completeDelivery(docId) {
  if (!currentUser) return;

  if (!confirm("क्या यह ऑर्डर ग्राहक को दे दिया गया है?")) return;

  const button = event && event.target;
  if (button) button.disabled = true;

  try {
    const ref = db.collection("orders").doc(docId);

    await db.runTransaction(async transaction => {
      const snapshot = await transaction.get(ref);
      if (!snapshot.exists) throw new Error("ऑर्डर नहीं मिला।");

      const o = snapshot.data();

      if ((o.assignedToEmail || "").toLowerCase() !==
          (currentUser.email || "").toLowerCase()) {
        throw new Error("यह ऑर्डर आपके नाम असाइन नहीं है।");
      }

      if (["Delivered", "Cancelled"].includes(o.status)) {
        throw new Error("ऑर्डर पहले ही पूरा या Cancel हो चुका है।");
      }

      transaction.update(ref, {
        status: "Delivered",
        deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
        deliveredBy: currentUser.displayName || currentUser.email,
        deliveredByEmail: currentUser.email
      });
    });

    const orderSnapshot = await ref.get();
    const o = orderSnapshot.data() || {};

    await db.collection("notificationRequests").add({
      type: "delivery_completed",
      status: "pending",
      orderId: o.id || docId,
      customerName: o.customerName || o.name || "",
      customerPhone: o.phone || "",
      deliveryBoyEmail: currentUser.email,
      message: "Order Delivered: " + (o.id || docId),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    $("message").textContent =
      "डिलीवरी पूरी हुई। सूचना request दर्ज हुई है; वास्तविक Push के लिए sender backend चाहिए।";

    await loadOrders();
  } catch (e) {
    $("message").textContent = "डिलीवरी अपडेट नहीं हुई: " + e.message;
    if (button) button.disabled = false;
  }
}

window.completeDelivery = completeDelivery;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  $("installBtn").classList.remove("hidden");
});

$("installBtn").onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  $("installBtn").classList.add("hidden");
};

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("./firebase-messaging-sw.js")
    .catch(e => console.log("Service worker registration:", e));
}
</script>
</body>
</html>
