<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#145b3b">
<title>VT Dairy Farm</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
:root{
  --green:#145b3b;--green-dark:#0b4029;--green-light:#e4f0e7;
  --cream:#fffaf0;--gold:#d9a441;--text:#26352b;--muted:#78847a;
  --border:#e9e2d3;--white:#fff;--red:#b83b32;
}
html{scroll-behavior:smooth}
body{margin:0;padding:0 0 40px;background:#f7f3e9;color:var(--text);font-family:Arial,sans-serif}
header{
  position:relative;overflow:hidden;text-align:center;padding:38px 18px 48px;color:white;
  background:linear-gradient(145deg,#0b4029,#145b3b 65%,#277b50);
  border-radius:0 0 34px 34px;box-shadow:0 8px 25px #123e292b
}
header:before,header:after{content:"";position:absolute;border:1px solid #ffffff20;border-radius:50%}
header:before{width:190px;height:190px;top:-100px;right:-45px}
header:after{width:130px;height:130px;bottom:-85px;left:-35px}
header h1{position:relative;z-index:1;margin:0 0 12px;font-size:29px;font-weight:800;letter-spacing:.3px}
header p{position:relative;z-index:1;margin:0;color:#e8f3e9;font-size:14px;letter-spacing:.5px}
.wrap{width:100%;max-width:720px;margin:24px auto;padding:0 15px}
#appMessage{border-radius:14px;padding:14px 16px;margin-bottom:18px}
.card{background:var(--white);border:1px solid var(--border);border-radius:23px;padding:21px;margin:18px 0;box-shadow:0 7px 22px #4b422010}
h2{display:flex;align-items:center;gap:9px;margin:0 0 20px;padding-bottom:14px;color:var(--green-dark);font-size:21px;font-weight:800;border-bottom:2px solid #f1eadb}
label{display:block;margin:19px 0 8px;color:#34483a;font-size:14px;font-weight:700}
input,textarea,select,button{font:inherit}
input,textarea{width:100%;padding:15px;color:var(--text);background:#fffdf8;border:1.5px solid #e5e0d4;border-radius:13px;outline:none;transition:.2s ease}
input:focus,textarea:focus{background:#fff;border-color:var(--green);box-shadow:0 0 0 4px #145b3b12}
textarea{min-height:95px;resize:vertical}
.product{display:flex;align-items:center;justify-content:space-between;gap:13px;margin:13px 0;padding:17px;background:var(--cream);border:1px solid #eee4ce;border-left:5px solid var(--gold);border-radius:15px;transition:.2s ease}
.product b{display:block;color:var(--green-dark);font-size:16px}
.product small{display:block;margin-top:7px;color:#8b7957;font-size:13px;font-weight:600}
.qty{width:95px;min-width:75px;padding:12px 7px;text-align:center;font-size:16px;font-weight:800;color:var(--green-dark);background:white;border:1.5px solid #d9e5d9;border-radius:12px}
.btn{border:0;border-radius:13px;padding:14px 17px;background:var(--green);color:white;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 10px #145b3b20;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.secondary{color:var(--green-dark);background:#e8f1e8;border:1px solid #d5e5d6;box-shadow:none}
.danger{color:var(--red);background:#fff0ed;border:1px solid #f1d4cf;box-shadow:none}
.wide{display:block;width:100%;margin-top:19px;padding:17px;color:white;background:linear-gradient(135deg,#145b3b,#23794d);border-radius:15px;font-size:17px;letter-spacing:.3px;box-shadow:0 6px 15px #145b3b2b}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.row .btn{flex:1;min-width:120px}
.total{margin-top:20px;padding:19px;text-align:center;color:var(--green-dark);background:linear-gradient(135deg,#f8efd9,#fff8e9);border:1px solid #eadbb8;border-radius:16px;font-size:21px;font-weight:800}
.notice{margin:13px 0;padding:15px;color:#315c3e;background:#edf5e9;border:1px solid #d8e8d5;border-radius:13px;font-size:14px;line-height:1.6}
.error{color:#9d3027;background:#fff0ed;border-color:#f0d2cc}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.order{margin:14px 0;padding:17px;background:#fffdf8;border:1px solid #e9e2d3;border-radius:16px;box-shadow:0 3px 12px #4b42200b}
.order h3{margin:0 0 14px;padding-bottom:11px;color:var(--green-dark);font-size:16px;border-bottom:1px dashed #e5ddca;overflow-wrap:anywhere}
.order p{margin:9px 0;color:#4e5d51;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.status{display:inline-block;padding:4px 10px;color:#17613a;background:#e5f3e8;border-radius:20px;font-size:12px;font-weight:800}
.cancel-status{color:#a32919;background:#fff0ed}
.order .danger{margin-top:9px}
@media(max-width:480px){
  header{padding:32px 15px 42px;border-radius:0 0 27px 27px}
  header h1{font-size:25px}
  .wrap{margin:18px auto;padding:0 11px}
  .card{padding:16px;border-radius:19px}
  h2{font-size:19px}
  .product{padding:13px 11px;gap:8px}
  .product b{font-size:14px}
  .qty{width:80px;min-width:70px;padding:11px 5px}
  .row{gap:8px}
  .row .btn{min-width:0;padding:12px 8px;font-size:12px}
  .total{font-size:19px}
  .wide{font-size:16px}
}
</style>
</head>
<body>
<header>
<h1>🥛 VT Dairy Farm</h1>
<p>ताज़ा दूध और Dairy Products</p>
</header>

<main class="wrap">
<div id="appMessage" class="notice">डेटाबेस से कनेक्ट हो रहा है…</div>
<section class="card">
<h2>🛒 ऑर्डर करें</h2>
<div id="products"><p class="muted">Products लोड हो रहे हैं…</p></div>
<div class="total">कुल राशि: ₹<span id="total">0</span></div>

<label for="customerName">आपका नाम</label>
<input id="customerName" autocomplete="name" maxlength="80" placeholder="पूरा नाम">
<label for="phone">मोबाइल नंबर (10 अंक)</label>
<input id="phone" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर">
<label for="address">पूरा पता</label>
<textarea id="address" autocomplete="street-address" maxlength="500" placeholder="गाँव/मोहल्ला, घर का पता"></textarea>

<div class="row">
<button class="btn secondary" type="button" id="locationBtn">📍 Current Location लें</button>
<button class="btn secondary" type="button" id="mapsBtn" disabled>Map देखें</button>
</div>
<p id="locationInfo" class="muted">Location देना वैकल्पिक है।</p>
<div class="notice">Payment: <b>Cash on Delivery</b> — ऑनलाइन पेमेंट नहीं है।</div>
<button id="placeOrder" class="btn wide" type="button">ऑर्डर भेजें</button>
</section>

<section class="card">
<h2>📦 मेरे ऑर्डर</h2>
<button id="refreshOrders" class="btn secondary" type="button">ऑर्डर Refresh करें</button>
<div id="orders"><p class="muted">आपके ऑर्डर यहाँ दिखेंगे।</p></div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';

const firebaseConfig = {
  apiKey: 'AIzaSyD9cwaW54d5VRfK6rbuqSExcz27bFHdSm8',
  authDomain: 'vt-dairy-farm-9afc8.firebaseapp.com',
  projectId: 'vt-dairy-farm-9afc8',
  storageBucket: 'vt-dairy-farm-9afc8.firebasestorage.app',
  messagingSenderId: '86012601125',
  appId: '1:86012601125:web:6a6d81f5d93aae16a030cc'
};

let auth = null;
let db = null;
let customerUid = null;
let products = [];
let locationData = null;
let orderBusy = false;

const $ = id => document.getElementById(id);

const defaults = [
  {id:'milk',name:'दूध (Milk)',unit:'लीटर',price:80,active:true},
  {id:'ghee',name:'घी (Ghee)',unit:'किलो',price:0,active:false},
  {id:'paneer',name:'पनीर (Paneer)',unit:'किलो',price:0,active:false},
  {id:'mawa',name:'मावा (Mawa)',unit:'किलो',price:0,active:false}
];

function message(text, isError = false) {
  $('appMessage').textContent = text;
  $('appMessage').className = 'notice' + (isError ? ' error' : '');
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function statusLabel(value) {
  const status = String(value || 'Pending').trim().toLowerCase();
  if (['cancelled','canceled','cancel'].includes(status)) return 'Cancel';
  if (status === 'delivered') return 'Delivered';
  if (status === 'confirmed') return 'Confirmed';
  return 'Pending';
}

function renderProducts() {
  const active = products.filter(p =>
    p.active === true &&
    Number.isFinite(Number(p.price)) &&
    Number(p.price) >= 0
  );

  if (!active.length) {
    $('products').innerHTML =
      '<p class="notice">अभी कोई Product उपलब्ध नहीं है। बाद में दोबारा कोशिश करें।</p>';
    updateTotal();
    return;
  }

  $('products').innerHTML = active.map(p => `
    <div class="product">
      <div>
        <b>${esc(p.name || p.id)}</b>
        <small>₹${Number(p.price)} / ${esc(p.unit || 'unit')}</small>
      </div>
      <input class="qty" type="number" min="0" max="1000" step="0.5"
        value="0" data-product="${esc(p.id)}"
        aria-label="${esc(p.name || p.id)} मात्रा">
    </div>
  `).join('');

  document.querySelectorAll('[data-product]').forEach(el => {
    el.addEventListener('input', updateTotal);
  });
  updateTotal();
}

function updateTotal() {
  let total = 0;
  document.querySelectorAll('[data-product]').forEach(el => {
    const product = products.find(p => p.id === el.dataset.product);
    let qty = Number(el.value);
    if (!Number.isFinite(qty) || qty < 0) qty = 0;
    if (qty > 1000) qty = 1000;
    if (product) total += qty * Number(product.price || 0);
  });
  $('total').textContent = total.toFixed(2).replace(/\.00$/, '');
}

async function loadProducts() {
  try {
    const snapshot = await db.collection('products').get();
    const loaded = [];
    snapshot.forEach(doc => {
      const data = doc.data() || {};
      loaded.push({
        id: doc.id,
        name: data.name || doc.id,
        unit: data.unit || (doc.id === 'milk' ? 'लीटर' : 'किलो'),
        price: Number(data.price ?? 0),
        active: data.active === true
      });
    });
    products = loaded.length ? loaded : defaults;
    renderProducts();
    if (!loaded.length) {
      message('Firebase में कोई Product नहीं मिला। डिफ़ॉल्ट सूची दिखाई जा रही है।');
    } else {
      message('Firebase Database connected.');
    }
  } catch (error) {
    console.error('Products load failed:', error);
    products = defaults;
    renderProducts();
    message(
      'Products Firebase से लोड नहीं हुए। Internet और Firestore Rules जाँचें। अभी डिफ़ॉल्ट सूची दिखाई गई है।',
      true
    );
  }
}

function selectedItems() {
  const items = [];
  document.querySelectorAll('[data-product]').forEach(el => {
    const qty = Number(el.value);
    const product = products.find(p => p.id === el.dataset.product);
    if (product && Number.isFinite(qty) && qty > 0 && qty <= 1000 && product.active === true) {
      items.push({
        productId: product.id,
        name: product.name,
        qty,
        quantity: qty,
        unit: product.unit || '',
        price: Number(product.price || 0),
        subtotal: qty * Number(product.price || 0)
      });
    }
  });
  return items;
}

function toMillis(value) {
  if (value && typeof value.toMillis === 'function') return value.toMillis();
  if (typeof value === 'number') return value;
  const date = Date.parse(value || '');
  return Number.isFinite(date) ? date : 0;
}

async function getMyOrders() {
  if (!db || !customerUid) return;
  try {
    const snapshot = await db.collection('orders')
      .where('customerUid', '==', customerUid).get();
    const list = [];
    snapshot.forEach(doc => list.push({...doc.data(), id:doc.id}));
    list.sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));

    if (!list.length) {
      $('orders').innerHTML = '<p class="muted">अभी आपके कोई ऑर्डर नहीं हैं।</p>';
      return;
    }

    $('orders').innerHTML = list.map(order => {
      const label = statusLabel(order.status);
      const cancelled = label === 'Cancel';
      const items = Array.isArray(order.items)
        ? order.items.map(item =>
            `${esc(item.name || item.productName || item.productId || 'Product')} × ${esc(item.qty ?? item.quantity ?? 0)}`
          ).join(', ')
        : '';
      const when = order.createdAt && order.createdAt.toDate
        ? order.createdAt.toDate().toLocaleString('hi-IN') : '';
      const canCancel = ['pending','confirmed'].includes(
        String(order.status || '').trim().toLowerCase()
      );

      return `
        <article class="order">
          <h3>ऑर्डर: ${esc(order.id)}</h3>
          <p>सामान: ${items}</p>
          <p>राशि: ₹${esc(order.total ?? 0)} · Payment: Cash</p>
          <p>स्थिति: <span class="status ${cancelled ? 'cancel-status' : ''}">${label}</span></p>
          <p class="muted">${esc(when)}</p>
          ${canCancel ? `
            <button class="btn danger" type="button" data-cancel="${esc(order.id)}">
              ऑर्डर Cancel करें
            </button>
          ` : ''}
        </article>
      `;
    }).join('');

    document.querySelectorAll('[data-cancel]').forEach(button => {
      button.addEventListener('click', () => cancelOrder(button.dataset.cancel));
    });
  } catch (error) {
    console.error('Orders load failed:', error);
    $('orders').innerHTML =
      '<p class="notice error">ऑर्डर नहीं लोड हुए। Firestore Rules और Internet जाँचें।</p>';
  }
}

async function cancelOrder(id) {
  if (!confirm('क्या आप यह ऑर्डर Cancel करना चाहते हैं?')) return;
  try {
    const ref = db.collection('orders').doc(id);
    const snapshot = await ref.get();
    if (!snapshot.exists || snapshot.data().customerUid !== customerUid) {
      message('यह ऑर्डर आपके खाते का नहीं है।', true);
      return;
    }

    const status = String(snapshot.data().status || '').toLowerCase();
    if (!['pending','confirmed'].includes(status)) {
      message('इस स्थिति में ऑर्डर Cancel नहीं हो सकता।', true);
      return;
    }

    await ref.update({
      status: 'Cancelled',
      cancelledBy: 'customer',
      cancelledByUid: customerUid,
      cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    try {
      await db.collection('notificationRequests').add({
        type: 'order_cancelled',
        orderId: id,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        customerUid
      });
    } catch (notificationError) {
      console.warn('Notification request failed:', notificationError);
    }

    message('ऑर्डर Cancel कर दिया गया।');
    await getMyOrders();
  } catch (error) {
    console.error('Cancel failed:', error);
    message('ऑर्डर Cancel नहीं हुआ। Firestore Rules जाँचें।', true);
  }
}

$('locationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    message('इस ब्राउज़र में Location उपलब्ध नहीं है।', true);
    return;
  }

  $('locationInfo').textContent = 'Location ली जा रही है…';
  navigator.geolocation.getCurrentPosition(
    position => {
      locationData = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        locationAccuracy: position.coords.accuracy,
        locationUrl:
          `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`
      };
      $('locationInfo').textContent =
        `Location मिल गई (accuracy लगभग ${Math.round(position.coords.accuracy)} मीटर)।`;
      $('mapsBtn').disabled = false;
    },
    error => {
      console.warn('Location failed:', error);
      $('locationInfo').textContent =
        'Location नहीं मिल सकी। Permission और GPS जाँचें।';
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
});

$('mapsBtn').addEventListener('click', () => {
  if (locationData) window.open(locationData.locationUrl, '_blank', 'noopener');
});

$('placeOrder').addEventListener('click', async () => {
  if (orderBusy) return;
  const customerName = $('customerName').value.trim();
  const phone = $('phone').value.replace(/\D/g, '');
  const address = $('address').value.trim();
  const items = selectedItems();

  if (!customerName || !address) {
    message('नाम और पूरा पता भरें।', true);
    return;
  }
  if (!/^\d{10}$/.test(phone)) {
    message('सही 10 अंकों का मोबाइल नंबर भरें।', true);
    return;
  }
  if (!items.length) {
    message('कम-से-कम एक Product की मात्रा भरें।', true);
    return;
  }
  if (!db || !customerUid) {
    message('Database/Auth तैयार नहीं है। Internet जाँचकर Refresh करें।', true);
    return;
  }

  orderBusy = true;
  $('placeOrder').disabled = true;
  try {
    const total = items.reduce((sum, item) => sum + item.subtotal, 0);
    const ref = db.collection('orders').doc();
    const data = {
      id: ref.id,
      customerUid,
      customerName,
      phone,
      address,
      items,
      total,
      status: 'Pending',
      paymentMethod: 'Cash',
      paymentStatus: 'Pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (locationData) Object.assign(data, locationData);
    await ref.set(data);

    message('ऑर्डर सफलतापूर्वक भेज दिया गया!');
    document.querySelectorAll('[data-product]').forEach(el => {el.value = '0';});
    updateTotal();
    $('customerName').value = '';
    $('phone').value = '';
    $('address').value = '';
    await getMyOrders();
  } catch (error) {
    console.error('Order submission failed:', error);
    message('ऑर्डर नहीं भेजा गया। Firestore Rules और Internet जाँचें।', true);
  } finally {
    orderBusy = false;
    $('placeOrder').disabled = false;
  }
});

$('refreshOrders').addEventListener('click', getMyOrders);

(async function init() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const credential = await auth.signInAnonymously();
    customerUid = credential.user.uid;
    await loadProducts();
    await getMyOrders();
  } catch (error) {
    console.error('Firebase initialization failed:', error);
    message(
      'Firebase Auth/Database कनेक्शन नहीं हुआ। Firebase में Anonymous Authentication चालू और Firestore Rules सही होने चाहिए।',
      true
    );
    products = defaults;
    renderProducts();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error => console.warn('Customer service worker registration failed:', error));
  }
})();
</script>
</body>
</html>
