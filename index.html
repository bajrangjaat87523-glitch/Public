<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087a45">
<title>VT Dairy Farm</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}

:root{
  --green:#087a45;
  --dark-green:#075b35;
  --light-green:#e8f5ed;
  --background:#f2f7f3;
  --text:#202b24;
  --muted:#718078;
  --border:#e0eae3;
  --white:#fff;
}

body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:Arial,sans-serif;
  padding-bottom:35px;
}

header{
  background:linear-gradient(135deg,#075b35,#087a45,#19a362);
  color:#fff;
  padding:30px 16px 34px;
  text-align:center;
  border-radius:0 0 28px 28px;
  box-shadow:0 5px 18px #087a4530;
}

header h1{
  margin:0 0 9px;
  font-size:27px;
  letter-spacing:.2px;
}

header p{
  margin:0;
  font-size:14px;
  opacity:.92;
}

.wrap{
  max-width:700px;
  margin:20px auto;
  padding:0 14px;
}

.card{
  background:var(--white);
  border:1px solid #edf1ed;
  border-radius:20px;
  padding:19px;
  margin:16px 0;
  box-shadow:0 5px 20px #163d2410;
}

h2{
  font-size:20px;
  margin:0 0 17px;
  color:var(--dark-green);
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
}

label{
  display:block;
  font-weight:700;
  margin:16px 0 7px;
  font-size:14px;
}

input,textarea,select,button{
  font:inherit;
}

input,textarea{
  width:100%;
  padding:14px;
  border:1px solid #d8e3da;
  border-radius:12px;
  background:#fbfdfb;
  color:var(--text);
  outline:none;
  transition:border .2s,box-shadow .2s;
}

input:focus,textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px #087a4518;
}

textarea{
  min-height:85px;
  resize:vertical;
}

.product{
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin:11px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(120deg,#fff,#f8fcf9);
  transition:box-shadow .2s;
}

.product b{
  font-size:15px;
}

.product small{
  display:block;
  color:var(--muted);
  margin-top:6px;
  font-size:13px;
}

.qty{
  width:95px;
  padding:11px 8px;
  text-align:center;
  font-weight:700;
  background:#fff;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:linear-gradient(135deg,#087a45,#099456);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 9px #087a4520;
  transition:transform .15s,opacity .15s;
}

.btn:active{
  transform:scale(.98);
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.secondary{
  background:#e8f5ed;
  color:#075d35;
  box-shadow:none;
  border:1px solid #d7eadc;
}

.danger{
  background:#fff0ed;
  color:#a32919;
  box-shadow:none;
  border:1px solid #f5d8d2;
}

.wide{
  width:100%;
  margin-top:15px;
  padding:15px;
  font-size:16px;
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.notice{
  padding:13px 14px;
  border-radius:12px;
  background:#edf7f0;
  border:1px solid #dcefe2;
  margin:12px 0;
  font-size:14px;
  line-height:1.5;
}

.error{
  background:#fff0ed;
  color:#9a2417;
  border-color:#f3d7d1;
}

.order{
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin:12px 0;
  background:#fff;
}

.order h3{
  margin:0 0 12px;
  font-size:16px;
  color:var(--dark-green);
  overflow-wrap:anywhere;
}

.order p{
  margin:8px 0;
  overflow-wrap:anywhere;
  font-size:14px;
  line-height:1.5;
}

.status{
  font-weight:bold;
  color:var(--green);
}

.cancel-status{
  color:#a32919;
}

.total{
  font-size:20px;
  font-weight:800;
  margin-top:17px;
  padding:15px;
  border-radius:13px;
  background:var(--light-green);
  color:var(--dark-green);
  text-align:center;
}

.row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:13px;
}

.row .btn{
  flex:1;
  min-width:120px;
}

#appMessage{
  border-radius:12px;
}

@media(max-width:420px){
  header h1{font-size:24px}
  .wrap{padding:0 11px}
  .card{padding:15px;border-radius:17px}
  .product{padding:12px}
  .qty{width:82px}
  .row .btn{font-size:13px;padding:12px 9px}
}
</style>
</head>

<body>
<header>
<h1>🥛 VT Dairy Farm</h1>
<p>ताज़ा दूध और Dairy Products</p>
</header>

<main class="wrap">
<div id="appMessage" class="notice">डेटाबेस से कनेक्ट हो रहा है…</div>

<section class="card">
<h2>🛒 ऑर्डर करें</h2>

<div id="products">
<p class="muted">Products लोड हो रहे हैं…</p>
</div>

<div class="total">कुल राशि: ₹<span id="total">0</span></div>

<label for="customerName">आपका नाम</label>
<input id="customerName" autocomplete="name" maxlength="80" placeholder="पूरा नाम">

<label for="phone">मोबाइल नंबर (10 अंक)</label>
<input id="phone" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर">

<label for="address">पूरा पता</label>
<textarea id="address" autocomplete="street-address" maxlength="500" placeholder="गाँव/मोहल्ला, घर का पता"></textarea>

<div class="row">
<button class="btn secondary" type="button" id="locationBtn">📍 Current Location लें</button>
<button class="btn secondary" type="button" id="mapsBtn" disabled>Map देखें</button>
</div>

<p id="locationInfo" class="muted">Location देना वैकल्पिक है।</p>

<div class="notice">
Payment: <b>Cash on Delivery</b> — ऑनलाइन पेमेंट नहीं है।
</div>

<button id="placeOrder" class="btn wide" type="button">ऑर्डर भेजें</button>
</section>

<section class="card">
<h2>📦 मेरे ऑर्डर</h2>
<button id="refreshOrders" class="btn secondary" type="button">ऑर्डर Refresh करें</button>
<div id="orders">
<p class="muted">आपके ऑर्डर यहाँ दिखेंगे।</p>
</div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
'use strict';

const firebaseConfig = {
  apiKey: 'AIzaSyD9cwaW54d5VRfK6rbuqSExcz27bFHdSm8',
  authDomain: 'vt-dairy-farm-9afc8.firebaseapp.com',
  projectId: 'vt-dairy-farm-9afc8',
  storageBucket: 'vt-dairy-farm-9afc8.firebasestorage.app',
  messagingSenderId: '86012601125',
  appId: '1:86012601125:web:6a6d81f5d93aae16a030cc'
};

let auth = null;
let db = null;
let customerUid = null;
let products = [];
let locationData = null;
let orderBusy = false;

const $ = id => document.getElementById(id);

const defaults = [
  {id:'milk',name:'दूध (Milk)',unit:'लीटर',price:80,active:true},
  {id:'ghee',name:'घी (Ghee)',unit:'किलो',price:0,active:false},
  {id:'paneer',name:'पनीर (Paneer)',unit:'किलो',price:0,active:false},
  {id:'mawa',name:'मावा (Mawa)',unit:'किलो',price:0,active:false}
];

function message(text, isError = false) {
  $('appMessage').textContent = text;
  $('appMessage').className = 'notice' + (isError ? ' error' : '');
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function statusLabel(value) {
  const status = String(value || 'Pending').trim().toLowerCase();

  if (['cancelled','canceled','cancel'].includes(status)) {
    return 'Cancel';
  }

  if (status === 'delivered') return 'Delivered';
  if (status === 'confirmed') return 'Confirmed';

  return 'Pending';
}

function renderProducts() {
  const active = products.filter(p =>
    p.active === true &&
    Number.isFinite(Number(p.price)) &&
    Number(p.price) >= 0
  );

  if (!active.length) {
    $('products').innerHTML =
      '<p class="notice">अभी कोई Product उपलब्ध नहीं है। बाद में दोबारा कोशिश करें।</p>';

    updateTotal();
    return;
  }

  $('products').innerHTML = active.map(p => `
    <div class="product">
      <div>
        <b>${esc(p.name || p.id)}</b>
        <small>₹${Number(p.price)} / ${esc(p.unit || 'unit')}</small>
      </div>

      <input
        class="qty"
        type="number"
        min="0"
        max="1000"
        step="0.5"
        value="0"
        data-product="${esc(p.id)}"
        aria-label="${esc(p.name || p.id)} मात्रा"
      >
    </div>
  `).join('');

  document.querySelectorAll('[data-product]').forEach(el => {
    el.addEventListener('input', updateTotal);
  });

  updateTotal();
}

function updateTotal() {
  let total = 0;

  document.querySelectorAll('[data-product]').forEach(el => {
    const product = products.find(p => p.id === el.dataset.product);
    let qty = Number(el.value);

    if (!Number.isFinite(qty) || qty < 0) qty = 0;
    if (qty > 1000) qty = 1000;

    if (product) {
      total += qty * Number(product.price || 0);
    }
  });

  $('total').textContent = total.toFixed(2).replace(/\.00$/, '');
}

async function loadProducts() {
  try {
    const snapshot = await db.collection('products').get();
    const loaded = [];

    snapshot.forEach(doc => {
      const data = doc.data() || {};

      loaded.push({
        id: doc.id,
        name: data.name || doc.id,
        unit: data.unit || (doc.id === 'milk' ? 'लीटर' : 'किलो'),
        price: Number(data.price ?? 0),
        active: data.active === true
      });
    });

    products = loaded.length ? loaded : defaults;
    renderProducts();

    if (!loaded.length) {
      message('Firebase में कोई Product नहीं मिला। डिफ़ॉल्ट सूची दिखाई जा रही है।');
    } else {
      message('Firebase Database connected.');
    }
  } catch (error) {
    console.error('Products load failed:', error);

    products = defaults;
    renderProducts();

    message(
      'Products Firebase से लोड नहीं हुए। Internet और Firestore Rules जाँचें। अभी डिफ़ॉल्ट सूची दिखाई गई है।',
      true
    );
  }
}

function selectedItems() {
  const items = [];

  document.querySelectorAll('[data-product]').forEach(el => {
    const qty = Number(el.value);
    const product = products.find(p => p.id === el.dataset.product);

    if (
      product &&
      Number.isFinite(qty) &&
      qty > 0 &&
      qty <= 1000 &&
      product.active === true
    ) {
      items.push({
        productId: product.id,
        name: product.name,
        qty,
        quantity: qty,
        unit: product.unit || '',
        price: Number(product.price || 0),
        subtotal: qty * Number(product.price || 0)
      });
    }
  });

  return items;
}

function toMillis(value) {
  if (value && typeof value.toMillis === 'function') {
    return value.toMillis();
  }

  if (typeof value === 'number') return value;

  const date = Date.parse(value || '');
  return Number.isFinite(date) ? date : 0;
}

async function getMyOrders() {
  if (!db || !customerUid) return;

  try {
    const snapshot = await db.collection('orders')
      .where('customerUid', '==', customerUid)
      .get();

    const list = [];

    snapshot.forEach(doc => {
      list.push({...doc.data(), id:doc.id});
    });

    list.sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));

    if (!list.length) {
      $('orders').innerHTML =
        '<p class="muted">अभी आपके कोई ऑर्डर नहीं हैं।</p>';
      return;
    }

    $('orders').innerHTML = list.map(order => {
      const label = statusLabel(order.status);
      const cancelled = label === 'Cancel';

      const items = Array.isArray(order.items)
        ? order.items.map(item =>
            `${esc(item.name || item.productName || item.productId || 'Product')} × ${esc(item.qty ?? item.quantity ?? 0)}`
          ).join(', ')
        : '';

      const when = order.createdAt && order.createdAt.toDate
        ? order.createdAt.toDate().toLocaleString('hi-IN')
        : '';

      const canCancel = ['pending','confirmed'].includes(
        String(order.status || '').trim().toLowerCase()
      );

      return `
        <article class="order">
          <h3>ऑर्डर: ${esc(order.id)}</h3>
          <p>सामान: ${items}</p>
          <p>राशि: ₹${esc(order.total ?? 0)} · Payment: Cash</p>
          <p>
            स्थिति:
            <span class="status ${cancelled ? 'cancel-status' : ''}">
              ${label}
            </span>
          </p>
          <p class="muted">${esc(when)}</p>

          ${canCancel ? `
            <button
              class="btn danger"
              type="button"
              data-cancel="${esc(order.id)}"
            >ऑर्डर Cancel करें</button>
          ` : ''}
        </article>
      `;
    }).join('');

    document.querySelectorAll('[data-cancel]').forEach(button => {
      button.addEventListener('click', () => {
        cancelOrder(button.dataset.cancel);
      });
    });

  } catch (error) {
    console.error('Orders load failed:', error);

    $('orders').innerHTML =
      '<p class="notice error">ऑर्डर नहीं लोड हुए। Firestore Rules और Internet जाँचें।</p>';
  }
}

async function cancelOrder(id) {
  if (!confirm('क्या आप यह ऑर्डर Cancel करना चाहते हैं?')) return;

  try {
    const ref = db.collection('orders').doc(id);
    const snapshot = await ref.get();

    if (!snapshot.exists || snapshot.data().customerUid !== customerUid) {
      message('यह ऑर्डर आपके खाते का नहीं है।', true);
      return;
    }

    const status = String(snapshot.data().status || '').toLowerCase();

    if (!['pending','confirmed'].includes(status)) {
      message('इस स्थिति में ऑर्डर Cancel नहीं हो सकता।', true);
      return;
    }

    await ref.update({
      status: 'Cancelled',
      cancelledBy: 'customer',
      cancelledByUid: customerUid,
      cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    try {
      await db.collection('notificationRequests').add({
        type: 'order_cancelled',
        orderId: id,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        customerUid
      });
    } catch (notificationError) {
      console.warn('Notification request failed:', notificationError);
    }

    message('ऑर्डर Cancel कर दिया गया।');
    await getMyOrders();

  } catch (error) {
    console.error('Cancel failed:', error);
    message('ऑर्डर Cancel नहीं हुआ। Firestore Rules जाँचें।', true);
  }
}

$('locationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    message('इस ब्राउज़र में Location उपलब्ध नहीं है।', true);
    return;
  }

  $('locationInfo').textContent = 'Location ली जा रही है…';

  navigator.geolocation.getCurrentPosition(
    position => {
      locationData = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        locationAccuracy: position.coords.accuracy,
        locationUrl:
          `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`
      };

      $('locationInfo').textContent =
        `Location मिल गई (accuracy लगभग ${Math.round(position.coords.accuracy)} मीटर)।`;

      $('mapsBtn').disabled = false;
    },
    error => {
      console.warn('Location failed:', error);

      $('locationInfo').textContent =
        'Location नहीं मिल सकी। Permission और GPS जाँचें।';
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});

$('mapsBtn').addEventListener('click', () => {
  if (locationData) {
    window.open(locationData.locationUrl, '_blank', 'noopener');
  }
});

$('placeOrder').addEventListener('click', async () => {
  if (orderBusy) return;

  const customerName = $('customerName').value.trim();
  const phone = $('phone').value.replace(/\D/g, '');
  const address = $('address').value.trim();
  const items = selectedItems();

  if (!customerName || !address) {
    message('नाम और पूरा पता भरें।', true);
    return;
  }

  if (!/^\d{10}$/.test(phone)) {
    message('सही 10 अंकों का मोबाइल नंबर भरें।', true);
    return;
  }

  if (!items.length) {
    message('कम-से-कम एक Product की मात्रा भरें।', true);
    return;
  }

  if (!db || !customerUid) {
    message('Database/Auth तैयार नहीं है। Internet जाँचकर Refresh करें।', true);
    return;
  }

  orderBusy = true;
  $('placeOrder').disabled = true;

  try {
    const total = items.reduce((sum, item) => sum + item.subtotal, 0);
    const ref = db.collection('orders').doc();

    const data = {
      id: ref.id,
      customerUid,
      customerName,
      phone,
      address,
      items,
      total,
      status: 'Pending',
      paymentMethod: 'Cash',
      paymentStatus: 'Pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (locationData) {
      Object.assign(data, locationData);
    }

    await ref.set(data);

    message('ऑर्डर सफलतापूर्वक भेज दिया गया!');

    document.querySelectorAll('[data-product]').forEach(el => {
      el.value = '0';
    });

    updateTotal();

    $('customerName').value = '';
    $('phone').value = '';
    $('address').value = '';

    await getMyOrders();

  } catch (error) {
    console.error('Order submission failed:', error);

    message('ऑर्डर नहीं भेजा गया। Firestore Rules और Internet जाँचें।', true);

  } finally {
    orderBusy = false;
    $('placeOrder').disabled = false;
  }
});

$('refreshOrders').addEventListener('click', getMyOrders);

(async function init() {
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    auth = firebase.auth();
    db = firebase.firestore();

    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const credential = await auth.signInAnonymously();
    customerUid = credential.user.uid;

    await loadProducts();
    await getMyOrders();

  } catch (error) {
    console.error('Firebase initialization failed:', error);

    message(
      'Firebase Auth/Database कनेक्शन नहीं हुआ। Firebase में Anonymous Authentication चालू और Firestore Rules सही होने चाहिए।',
      true
    );

    products = defaults;
    renderProducts();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error => {
        console.warn('Customer service worker registration failed:', error);
      });
  }
})();
</script>
</body>
</html>
